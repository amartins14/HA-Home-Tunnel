name: Stable release draft

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify:
    if: ${{ !contains(github.ref_name, '-dev') }}
    uses: ./.github/workflows/verify.yml

  draft:
    if: ${{ !contains(github.ref_name, '-dev') }}
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref }}
      - name: Package and validate stable relay
        id: package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          $config = Get-Content 'home-assistant/config.yaml' -Raw
          $appMatch = [regex]::Match($config, '(?m)^version:\s*["'']?([^"''\s#]+)')
          if (!$appMatch.Success) { throw 'Could not read the Home Assistant app version' }
          $appVersion = $appMatch.Groups[1].Value
          if ($tagVersion -ne $appVersion) { throw "Tag $tagVersion does not match app version $appVersion" }
          if ($tagVersion -match '-dev(?:\.|$)') { throw 'Stable release tags cannot use development versions' }
          if ($tagVersion -notmatch '^\d+\.\d+\.\d+$') { throw 'Stable release tag must be a semantic version' }
          $metricsSource = Get-Content 'home-assistant/connector/metrics.py' -Raw
          $metricsMatch = [regex]::Match($metricsSource, '(?m)^VERSION\s*=\s*["'']([^"'']+)["'']')
          if (!$metricsMatch.Success -or $metricsMatch.Groups[1].Value -ne $appVersion) { throw 'Metrics version does not match the Home Assistant app version' }

          $relaySource = Get-Content 'relay/App_Code/HaTunnel.cs' -Raw
          $relayMatch = [regex]::Match($relaySource, 'public const string Version = "([^"\r\n]+)";')
          if (!$relayMatch.Success) { throw 'Could not read the relay version' }
          $relayVersion = $relayMatch.Groups[1].Value
          if ($relayVersion -match '-dev(?:\.|$)') { throw 'Stable release cannot package a development relay' }
          $manifest = Get-Content 'release-manifest.json' -Raw | ConvertFrom-Json
          if ($manifest.latest_relay_version -ne $relayVersion) { throw 'Relay version does not match release-manifest.json' }
          if ($manifest.compatible_home_tunnel_versions -notcontains $appVersion) { throw 'Manifest does not list this app version as relay-compatible' }

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $asset = "dist/home-tunnel-relay-$relayVersion.zip"
          Compress-Archive -Path 'relay/*' -DestinationPath $asset -CompressionLevel Optimal
          $output = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "app_version=$appVersion`nrelay_version=$relayVersion`nasset=$asset`n", $output)
      - name: Prepare release notes
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.package.outputs.app_version }}'
          $changelog = Get-Content 'CHANGELOG.md' -Raw
          $pattern = '(?ms)^##\s+' + [regex]::Escape($version) + '\s*\r?\n(?<notes>.*?)(?=^##\s|\z)'
          $match = [regex]::Match($changelog, $pattern)
          if (!$match.Success) { throw "No changelog section found for $version" }
          Set-Content -Path "$env:RUNNER_TEMP/release-notes.md" -Value $match.Groups['notes'].Value.Trim() -Encoding utf8
      - name: Create stable GitHub release draft
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE_RELEASE_TAG: ${{ github.ref_name }}
        shell: powershell
        run: |
          $releaseTag = $env:STABLE_RELEASE_TAG
          $expectedTag = 'v${{ steps.package.outputs.app_version }}'
          if ($releaseTag -ne $expectedTag) { throw "Release tag $releaseTag does not match $expectedTag" }
          gh release create $releaseTag '${{ steps.package.outputs.asset }}' `
            --repo $env:GITHUB_REPOSITORY `
            --title 'Home Tunnel ${{ steps.package.outputs.app_version }}' `
            --notes-file "$env:RUNNER_TEMP/release-notes.md" `
            --draft --verify-tag
