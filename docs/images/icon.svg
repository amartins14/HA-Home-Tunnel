<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Home Tunnel</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#29B6F6"/>
      <stop offset="1" stop-color="#0277BD"/>
    </linearGradient>
    <linearGradient id="hole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#01579B"/>
      <stop offset="1" stop-color="#0277BD"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- House -->
  <path d="M64 20 L108 57 Q110 59 107 59 H100 V100 Q100 106 94 106 H34 Q28 106 28 100 V59 H21 Q18 59 20 57 Z" fill="#fff"/>
  <!-- Tunnel opening -->
  <path d="M42 106 V82 A22 22 0 0 1 86 82 V106 Z" fill="url(#hole)"/>
  <!-- Road -->
  <path d="M64 88 V106" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-dasharray="5 6"/>
  <!-- Light at the end of the tunnel -->
  <circle cx="64" cy="76" r="5" fill="#B3E5FC"/>
</svg>
