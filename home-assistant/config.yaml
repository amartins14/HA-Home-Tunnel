name: Home Tunnel
version: "0.4.1-dev"
slug: home_tunnel
description: Secure setup and outgoing relay to your self-hosted endpoint
homeassistant: "2026.9.0"
arch: [aarch64, amd64]
startup: application
boot: auto
init: false
hassio_api: false
homeassistant_api: false
docker_api: false
host_network: false
host_pid: false
host_ipc: false
full_access: false
apparmor: true
privileged: []
map:
  - type: app_config
    read_only: true
    path: /secrets
ingress: true
ingress_port: 8099
panel_admin: true
ports:
  8100/tcp: null
options:
  homeassistant_url: http://homeassistant:8123
schema:
  homeassistant_url: str
