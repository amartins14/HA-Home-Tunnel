name: Home Tunnel
version: "0.7.4"
slug: home_tunnel
description: Reach Home Assistant from anywhere through a relay you host
homeassistant: "2026.9.0"
arch: [aarch64, amd64]
startup: application
boot: auto
init: false
hassio_api: false
homeassistant_api: true
docker_api: false
host_network: false
host_pid: false
host_ipc: false
full_access: false
apparmor: true
privileged: []
map:
  - type: app_config
    read_only: true
    path: /secrets
ingress: true
ingress_port: 8099
panel_admin: true
panel_icon: mdi:lan-connect
panel_title: Home Tunnel
ports:
  8100/tcp: null
options:
  homeassistant_url: http://homeassistant:8123
  metrics_token: ""
  geolocation_lookup: false
schema:
  homeassistant_url: str
  metrics_token: password
  geolocation_lookup: bool
