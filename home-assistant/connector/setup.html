<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="ingress-base" content="__INGRESS_BASE__">
  <title>Home Tunnel</title>
  <style>
    /* Colours follow the Home Assistant theme: the page copies HA's theme variables from the
       parent frame (same origin under ingress). These are the fallbacks when it can't. */
    :root{
      --primary-background-color:#fafafa;--secondary-background-color:#f0f0f0;--card-background-color:#fff;
      --primary-text-color:#212121;--secondary-text-color:#727272;--divider-color:rgba(0,0,0,.12);
      --primary-color:#03a9f4;--rgb-primary-color:3,169,244;--text-primary-color:#fff;
      --app-header-background-color:var(--primary-background-color);--app-header-text-color:var(--primary-text-color);
      --success-color:#43a047;--rgb-success-color:67,160,71;--warning-color:#ffa600;--rgb-warning-color:255,166,0;
      --error-color:#db4437;--rgb-error-color:219,68,55;--disabled-color:#bdbdbd;
      --ha-card-border-radius:12px;--code-font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
      --ha-font-family-body:Roboto,"Segoe UI",Arial,sans-serif;
    }
    @media (prefers-color-scheme:dark){:root:not([data-themed]){
      --primary-background-color:#111;--secondary-background-color:#202020;--card-background-color:#1c1c1c;
      --primary-text-color:#e1e1e1;--secondary-text-color:#9b9b9b;--divider-color:rgba(225,225,225,.12);
      --disabled-color:#6f6f6f;color-scheme:dark;
    }}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%}
    body{background:var(--primary-background-color);color:var(--primary-text-color);font-family:var(--ha-font-family-body);font-size:14px;-webkit-font-smoothing:antialiased}
    a{color:var(--primary-color)}
    .top{position:sticky;top:0;z-index:2;background:var(--app-header-background-color);color:var(--app-header-text-color);border-bottom:1px solid var(--divider-color)}
    .bar{display:flex;align-items:center;gap:12px;height:56px;padding:0 16px;max-width:960px;margin:0 auto}
    .bar h1{font-size:20px;font-weight:400;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .ha-narrow .bar h1{visibility:hidden}
    .pill{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:500;background:var(--secondary-background-color);white-space:nowrap;max-width:60vw;overflow:hidden;text-overflow:ellipsis}
    .dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--disabled-color)}
    .ok .dot,.dot.ok{background:var(--success-color);box-shadow:0 0 0 3px rgba(var(--rgb-success-color),.25)}
    .warn .dot,.dot.warn{background:var(--warning-color);box-shadow:0 0 0 3px rgba(var(--rgb-warning-color),.25)}
    .bad .dot,.dot.bad{background:var(--error-color);box-shadow:0 0 0 3px rgba(var(--rgb-error-color),.25)}
    .tabs{display:flex;max-width:960px;margin:0 auto;padding:0 8px}
    .tabs button{border:0;background:none;color:var(--secondary-text-color);font:inherit;font-weight:500;padding:12px 16px;cursor:pointer;border-bottom:2px solid transparent;min-height:48px}
    .tabs button[aria-selected=true]{color:var(--primary-color);border-bottom-color:var(--primary-color)}
    main{max-width:960px;margin:0 auto;padding:16px 16px 64px}
    .intro{color:var(--secondary-text-color);margin:4px 4px 16px;line-height:1.45}
    .card{background:var(--card-background-color);border-radius:var(--ha-card-border-radius);border:1px solid var(--divider-color);margin:0 0 12px;overflow:hidden}
    .head{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 16px 10px}
    .head h2{font-size:16px;font-weight:500;margin:0}
    .head p{margin:2px 0 0;font-size:13px;line-height:1.4;color:var(--secondary-text-color);overflow-wrap:anywhere}
    .head p.warn{color:var(--warning-color)}
    .head .grow{min-width:180px}
    .icon{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(var(--rgb-primary-color),.15);color:var(--primary-color)}
    .icon.ok{background:rgba(var(--rgb-success-color),.15);color:var(--success-color)}
    .icon.warn{background:rgba(var(--rgb-warning-color),.15);color:var(--warning-color)}
    .icon.bad{background:rgba(var(--rgb-error-color),.15);color:var(--error-color)}
    .icon svg,.btn svg,.chev{width:24px;height:24px;fill:currentColor}
    .btn svg{width:18px;height:18px}
    .group{padding:16px 16px 4px;font-size:13px;font-weight:500;text-transform:uppercase;letter-spacing:.05em;color:var(--secondary-text-color);border-top:1px solid var(--divider-color)}
    .row{display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:52px;flex-wrap:wrap;border-top:1px solid var(--divider-color)}
    .head+.row,.group+.row,.head+.tiles{border-top:0}
    .grow{flex:1;min-width:140px}
    .title{font-weight:500;overflow-wrap:anywhere}
    .sub{font-size:13px;color:var(--secondary-text-color);overflow-wrap:anywhere;margin-top:2px;line-height:1.4}
    .sub.warn{color:var(--warning-color)}
    .sub.bad{color:var(--error-color)}
    .value{font-weight:500;text-align:right;overflow-wrap:anywhere}
    .mono{font-family:var(--code-font-family)}
    .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
    .chip{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--secondary-background-color);color:var(--secondary-text-color);white-space:nowrap}
    .chip.on,.chip.ok{background:rgba(var(--rgb-success-color),.15);color:var(--success-color)}
    .chip.warn{background:rgba(var(--rgb-warning-color),.15);color:var(--warning-color)}
    .chip.bad{background:rgba(var(--rgb-error-color),.15);color:var(--error-color)}
    .cc{display:inline-block;min-width:24px;margin-right:6px;padding:0 4px;border-radius:4px;border:1px solid var(--divider-color);font-family:var(--code-font-family);font-size:11px;font-weight:600;line-height:16px;text-align:center;color:var(--secondary-text-color);vertical-align:1px}
    .chip .cc{border-color:currentColor;color:inherit;margin-right:4px}
    .chip-x{border:0;background:none;color:inherit;font:inherit;font-size:14px;line-height:1;padding:0 0 0 6px;cursor:pointer}
    .chip.info{background:rgba(var(--rgb-primary-color),.15);color:var(--primary-color)}
    .method{font-family:var(--code-font-family);font-size:11px;font-weight:600;min-width:52px;text-align:center}
    select,input[type=text],input[type=url],input[type=search],input[type=number]{font:inherit;color:inherit;background:var(--secondary-background-color);border:1px solid var(--divider-color);border-radius:8px;padding:8px 10px;min-height:44px;max-width:100%;width:100%}
    select{width:auto}
    input:focus-visible,select:focus-visible{outline:2px solid var(--primary-color);outline-offset:1px}
    label.field{display:block;font-size:13px;color:var(--secondary-text-color);margin-bottom:6px}
    .btn{font:inherit;font-weight:500;border:1px solid var(--divider-color);background:var(--card-background-color);color:inherit;border-radius:8px;padding:8px 16px;min-height:40px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap}
    .btn.primary{background:var(--primary-color);border-color:var(--primary-color);color:var(--text-primary-color)}
    .btn.danger{color:var(--error-color)}
    .btn.text{border-color:transparent;background:none;color:var(--primary-color);padding:6px 10px;min-height:32px}
    .btn.text.danger{color:var(--error-color)}
    .btn:disabled{opacity:.5;cursor:default}
    .btn:focus-visible,.clickable:focus-visible,.tabs button:focus-visible,.seg button:focus-visible{outline:2px solid var(--primary-color);outline-offset:2px}
    .seg{display:inline-flex;border:1px solid var(--divider-color);border-radius:8px;overflow:hidden;flex:none}
    .seg button{font:inherit;font-size:14px;border:0;border-left:1px solid var(--divider-color);background:none;color:inherit;padding:6px 14px;min-height:38px;cursor:pointer}
    .seg button:first-child{border-left:0}
    .seg button[aria-pressed=true]{background:var(--primary-color);color:var(--text-primary-color)}
    .status{margin:0 0 16px;padding:12px 16px;border-radius:8px;font-size:14px;background:rgba(var(--rgb-success-color),.15)}
    .status.error{background:rgba(var(--rgb-error-color),.15);color:var(--error-color)}
    .notice{margin:0 0 16px;padding:12px 16px;border-radius:8px;font-size:14px;background:rgba(var(--rgb-warning-color),.15)}
    .notice.info{background:rgba(var(--rgb-primary-color),.12)}
    .notice ul{margin:6px 0 0;padding-left:18px}
    .notice .btn{margin-top:8px}
    .empty{padding:16px;color:var(--secondary-text-color)}
    .clickable{cursor:pointer}
    .clickable:hover{background:var(--secondary-background-color)}
    .chev{color:var(--secondary-text-color);flex:none}
    .switch{appearance:none;-webkit-appearance:none;width:44px;height:24px;border-radius:12px;background:var(--disabled-color);position:relative;cursor:pointer;margin:0;flex:none;transition:background .15s}
    .switch::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
    .switch:checked{background:var(--primary-color)}
    .switch:checked::after{left:23px}
    .switch:disabled{opacity:.4;cursor:default}
    .switch:focus-visible{outline:2px solid var(--primary-color);outline-offset:2px}
    label.grow{cursor:pointer}
    .pad{padding:0 16px 16px}
    .fields{display:flex;flex-wrap:wrap;gap:12px 16px;padding:0 16px 16px;align-items:flex-end}
    .fields>div{flex:1;min-width:220px}
    .danger-zone{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px}
    .code{display:block;margin:0;padding:12px;border-radius:8px;background:var(--secondary-background-color);font-family:var(--code-font-family);font-size:13px;overflow-wrap:anywhere;user-select:all}
    .tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--divider-color)}
    .tile{padding:12px 16px;border:0;border-left:1px solid var(--divider-color);min-width:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer;box-shadow:inset 0 -2px 0 transparent}
    .tile:hover{background:var(--secondary-background-color)}
    .tile[aria-pressed=true]{box-shadow:inset 0 -2px 0 var(--primary-color)}
    .tile[aria-pressed=true] .sub{color:var(--primary-color)}
    .tile:focus-visible{outline:2px solid var(--primary-color);outline-offset:-2px}
    .tile:first-child{border-left:0}
    .tile .sub{margin:0}
    .tile strong{display:block;font-size:22px;font-weight:400;margin-top:6px;overflow-wrap:anywhere}
    .tile strong small{font-size:13px;color:var(--secondary-text-color);margin-left:3px}
    .charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;border-top:1px solid var(--divider-color)}
    .chart{padding:12px 16px 14px;min-width:0}
    .chart+.chart{border-left:1px solid var(--divider-color)}
    .chart{border-top:1px solid var(--divider-color)}
    .chart svg{display:block;width:100%;height:150px;margin-top:8px;overflow:visible}
    .chart .line{fill:none;stroke:var(--primary-color);stroke-width:2;vector-effect:non-scaling-stroke;stroke-linejoin:round}
    .chart .area{fill:rgba(var(--rgb-primary-color),.14);stroke:none}
    .chart .grid{stroke:var(--divider-color);stroke-width:1;vector-effect:non-scaling-stroke}
    .axis{display:flex;justify-content:space-between;font-size:12px;color:var(--secondary-text-color);margin-top:4px}
    .steps{counter-reset:step}
    .step{display:flex;gap:12px;padding:14px 16px;border-top:1px solid var(--divider-color)}
    .step .num{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:500;background:var(--secondary-background-color);color:var(--secondary-text-color)}
    .step.current .num{background:var(--primary-color);color:var(--text-primary-color)}
    .step.done .num{background:rgba(var(--rgb-success-color),.2);color:var(--success-color)}
    .step.later{opacity:.55}
    .step .body{flex:1;min-width:0}
    .step .body>*+*{margin-top:10px}
    .actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
    .toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:0 0 16px}
    .toolbar input{flex:1;min-width:200px;width:auto}
    .selected{background:rgba(var(--rgb-primary-color),.08)}
    .spinner{width:18px;height:18px;border-radius:50%;border:2px solid rgba(var(--rgb-primary-color),.25);border-top-color:var(--primary-color);animation:spin 1s linear infinite;flex:none}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){.spinner{animation:none}.switch,.switch::after{transition:none}}
    .hidden{display:none!important}
    .row.heading .title{font-size:16px}
    .row.dense{min-height:44px;padding:8px 16px}
    .title.path{font-weight:400;font-size:13px}
    .title .chip{margin-left:8px;font-family:var(--ha-font-family-body);font-weight:500;vertical-align:1px}
    .btn.icon-only{padding:6px 8px}
    .foot{padding:10px 16px 12px;font-size:12px;color:var(--secondary-text-color);border-top:1px solid var(--divider-color)}
    .kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px 16px;padding:4px 16px 16px}
    .tone-warn{color:var(--warning-color)}
    .tone-bad{color:var(--error-color)}
    details.more{border-top:1px solid var(--divider-color)}
    details.more>summary,details.fold>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px}
    details.more>summary{padding:12px 16px;color:var(--primary-color);font-weight:500}
    details.more>summary::-webkit-details-marker,details.fold>summary::-webkit-details-marker{display:none}
    details.more>summary:hover,details.fold>summary:hover{background:var(--secondary-background-color)}
    details[open]>summary>.chev{transform:rotate(180deg)}
    details.fold[open]>summary{border-bottom:1px solid var(--divider-color)}
    details.fold>summary+.row{border-top:0}
    summary:focus-visible{outline:2px solid var(--primary-color);outline-offset:-2px}
    .inline-form{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px 16px;border-top:1px solid var(--divider-color)}
    .inline-form input{flex:1;min-width:200px;width:auto}
    .chip-select{max-width:160px;min-height:26px;padding:2px 8px;border-radius:999px;font-size:12px;width:auto;background:none;border:1px dashed var(--divider-color);color:var(--primary-color);cursor:pointer}
    .chip-btn{border:1px solid transparent;font:inherit;font-size:12px;cursor:pointer}
    .chip-btn:hover{border-color:var(--divider-color)}
    .chip-btn.danger-chip:hover{border-color:var(--error-color);color:var(--error-color)}
    .chip .count{margin-left:6px;opacity:.7}
    .toolbar{flex-direction:column;align-items:stretch;gap:8px}
    .toolbar input{width:100%}
    .toolbar-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .toolbar-row select{flex:0 1 auto;min-height:40px}
    .toolbar-row.nowrap{flex-wrap:nowrap}
    .toolbar-row input{flex:1;min-width:0}
    .row.nowrap{flex-wrap:nowrap}
    .row.nowrap>.grow{min-width:0}
    .side{display:flex;align-items:center;gap:4px;flex:none}
    .seg button{white-space:nowrap}
    .notice{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
    .notice .btn{margin-top:0}
    .card>.row:first-child,.card>.row.heading{border-top:0}
    .tl{align-items:flex-start}
    .tl>.dot{margin-top:6px}
    .tl .when{white-space:nowrap;margin-top:2px}
    .tl.now{background:rgba(var(--rgb-warning-color),.06)}
    .dot.info{background:var(--primary-color);box-shadow:0 0 0 3px rgba(var(--rgb-primary-color),.25)}
    .uptime{padding:0 16px 12px}
    .strip{display:flex;gap:1px;height:22px}
    .strip span{flex:1;border-radius:2px;background:var(--divider-color)}
    .strip .u2{background:var(--success-color)}
    .strip .u1{background:var(--warning-color)}
    .strip .u0{background:var(--error-color)}
    .btn .box{width:14px;height:14px;border:2px solid currentColor;border-radius:3px;display:inline-block}
    .btn .box.checked{background:currentColor;box-shadow:inset 0 0 0 2px var(--card-background-color)}
    body.locked{overflow:hidden}
    .overlay{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.45);display:flex;justify-content:flex-end}
    .panel{width:min(440px,100%);height:100%;background:var(--card-background-color);border-left:1px solid var(--divider-color);display:flex;flex-direction:column;box-shadow:-8px 0 24px rgba(0,0,0,.25)}
    .panel-head{display:flex;align-items:center;gap:4px;padding:10px 8px 10px 16px;border-bottom:1px solid var(--divider-color)}
    .panel-head h2{font-size:17px;font-weight:500;margin:0;overflow-wrap:anywhere}
    .panel-head h2 .chip{margin-left:8px;font-family:var(--ha-font-family-body);vertical-align:2px}
    #panel-close{font-size:24px;line-height:1;padding:4px 12px}
    .panel-body{flex:1;overflow-y:auto;padding-bottom:24px}
    .panel-body .row select{width:auto}
    @media (max-width:600px){.overlay{align-items:flex-end}.panel{height:88%;border-left:0;border-radius:16px 16px 0 0}}
    @media (max-width:700px){
      .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
      .tile:nth-child(3){border-left:0}
      .tile:nth-child(n+3){border-top:1px solid var(--divider-color)}
      .charts{grid-template-columns:minmax(0,1fr)}
      .chart svg{height:120px}
    }
    @media (max-width:600px){
      main{padding:12px 12px 64px}
      .bar{padding:0 12px}
      .tabs button{flex:1;padding:12px 4px}
      .value{text-align:left}
      .side{flex-direction:column;align-items:flex-end}
      .seg button{padding:6px 10px}
    }
  </style>
</head>

  // The tunnel over the last 24 hours, in 15-minute slices; a slice shows its worst minute.
  function uptimeStrip() {
    const t = state.timeline;
    if (!t || !Array.isArray(t.uptime)) return null;
    const SLICE = 15, now = t.minute, start = now - 24 * 60 + 1;
    const slices = Array(96).fill(null);
    let recorded = 0, online = 0;
    for (const [first, last, value] of t.uptime) {
      for (let minute = Math.max(first, start); minute <= Math.min(last, now); minute++) {
        const i = Math.floor((minute - start) / SLICE);
        slices[i] = slices[i] == null ? value : Math.min(slices[i], value);
        recorded++; if (value === 2) online++;
      }
    }
    const NAMES = ['Offline', 'Forwarding off', 'Online'];
    const clock = minute => new Date(minute * 60000).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
    return el('div', {class: 'uptime'},
      el('div', {class: 'strip', role: 'img', 'aria-label': recorded ? `Online ${fmt(100 * online / recorded, 1)}% of the recorded last 24 hours` : 'No uptime recorded yet'},
        slices.map((value, i) => el('span', {class: `u${value == null ? 'x' : value}`,
          title: `${clock(start + i * SLICE)}–${clock(start + (i + 1) * SLICE)}: ${value == null ? 'not recorded' : NAMES[value]}`}))),
      el('div', {class: 'axis'}, el('span', {}, '24 h ago'),
        el('span', {}, recorded ? `${fmt(100 * online / recorded, recorded === online ? 0 : 1)}% online` : 'Recording from now on'), el('span', {}, 'now')));
  }

  function telemetryReason() {
    const t = state.telemetry;
    if (!t) return 'Loading…';
    if (t.reason === 'invalid_configuration') return 'Check the metrics token in the app’s Configuration tab.';
    return 'Telemetry appears once the connector is connected.';
  }

  // Server-side traffic history, grouped so a chart has at most ~120 points.
  function historySeries() {
    const h = state.history;
    const span = state.histWindow, step = Math.max(1, Math.round(span / 120));
    const now = Math.floor(Date.now() / 60000), start = now - span + 1;
    const out = {rate: [], latency: [], bad: [], bytes: [], start, span, total: 0, totalBytes: 0, signins: 0};
    if (!h?.available) return out;
    const f = Object.fromEntries(h.fields.map((name, i) => [name, i]));
    const buckets = new Map();
    for (const row of h.minutes) {
      const minute = row[f.minute];
      if (minute < start) continue;
      const key = start + Math.floor((minute - start) / step) * step;
      const b = buckets.get(key) || {req: 0, bytes: 0, lat: 0, latN: 0, bad: 0};
      b.req += row[f.requests]; b.bytes += row[f.bytes]; b.lat += row[f.latency_sum]; b.latN += row[f.latency_count];
      b.bad += row[f.denied] + row[f.errors];
      buckets.set(key, b);
      out.total += row[f.requests]; out.totalBytes += row[f.bytes]; out.signins += row[f.signins];
    }
    for (let key = start; key <= now; key += step) {
      const b = buckets.get(key);
      const at = key + step / 2;
      out.rate.push([at, b ? b.req / step : 0]);
      out.bad.push([at, b ? b.bad / step : 0]);
      out.bytes.push([at, b ? b.bytes / step : 0]);
      if (b && b.latN) out.latency.push([at, b.lat / b.latN]);
    }
    return out;
  }

  function chart(label, points, digits, series, format = value => fmt(value, digits)) {
    const W = 600, H = 140;
    const {start, span} = series;
    const values = points.map(p => p[1]);
    const peak = values.length ? Math.max(...values) : null;
    const current = points.length ? points[points.length - 1][1] : null;
    const max = Math.max(1, peak || 0) * 1.1;
    const name = WINDOWS.find(([v]) => v === span)[1];
    const graph = svgEl('svg', {viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: 'none', role: 'img',
      'aria-label': `${label} over the last ${name}${peak != null ? `, peak ${format(peak)}` : ''}`});
    for (const y of [0, H / 2, H]) graph.append(svgEl('line', {x1: 0, x2: W, y1: y, y2: y, class: 'grid'}));
    if (points.length > 1) {
      const xy = points.map(([at, v]) => [W * (at - start) / span, H - H * v / max]);
      const line = xy.map(([x, y], i) => `${i ? 'L' : 'M'}${x.toFixed(1)},${y.toFixed(1)}`).join(' ');
      graph.append(svgEl('path', {d: `${line} L${xy[xy.length - 1][0].toFixed(1)},${H} L${xy[0][0].toFixed(1)},${H} Z`, class: 'area'}),
        svgEl('path', {d: line, class: 'line'}));
    }
    return el('div', {class: 'chart'},
      el('div', {class: 'actions', style: 'justify-content:space-between'},
        el('div', {class: 'sub', style: 'margin:0'}, label),
        el('div', {class: 'sub', style: 'margin:0'}, `peak ${peak != null ? format(peak) : '—'} · now ${current == null ? '—' : format(current)}`)),
      graph,
      el('div', {class: 'axis'}, el('span', {}, state.history?.available === false ? 'History appears once the connector runs' : `${name} ago`), el('span', {}, 'now')));
  }

  async function setForwarding(on, input) {
    if (!on) {
      const warning = viaTunnel()
        ? 'You are using Home Assistant through the tunnel right now. Turning forwarding off will disconnect this page, and you will need to turn it back on from your home network. Turn it off?'
        : 'Turn forwarding off? The public URL will stop reaching Home Assistant until you turn it back on.';
      if (!confirm(warning)) { input.checked = true; return; }
    }
    await act(() => api(on ? 'enable' : 'disable', {}), on ? 'Forwarding is on.' : 'Forwarding is off.');
  }

  // ----- Activity -----
  function blockedRow(ip) {
    const rows = state.blocks?.blocks || [];
    return rows.find(row => cidrContains(row.cidr, ip));
  }

  // Minimal CIDR test for display; the app and relay make the real decision.
  function cidrContains(cidr, ip) {
    if (!isIp(ip)) return false;
    const [net, bits] = cidr.split('/');
    const parse = value => {
      if (value.includes(':')) {
        let [head, tail] = value.split('::');
        const h = head ? head.split(':') : [], t = tail != null ? (tail ? tail.split(':') : []) : [];
        if (tail == null && h.length !== 8) return null;
        const groups = tail == null ? h : [...h, ...Array(8 - h.length - t.length).fill('0'), ...t];
        return groups.map(g => parseInt(g || '0', 16)).flatMap(g => [g >> 8, g & 255]);
      }
      const parts = value.split('.').map(Number);
      return parts.length === 4 ? parts : null;
    };
    const a = parse(net), b = parse(ip.replace(/^::ffff:(?=\d+\.)/i, ''));
    if (!a || !b || a.length !== b.length) return false;
    const prefix = bits == null ? a.length * 8 : Number(bits);
    for (let bit = 0; bit < prefix; bit++) {
      const mask = 0x80 >> (bit % 8);
      if ((a[bit >> 3] & mask) !== (b[bit >> 3] & mask)) return false;
    }
    return true;
  }

  // Callers per country, most requests first.
  function countryGroups(callers) {
    const groups = new Map();
    for (const row of callers) {
      const code = state.countries[row.ip];
      if (!code) continue;
      const g = groups.get(code) || {code, callers: 0, requests: 0};
      g.callers++; g.requests += num(row.requests);
      groups.set(code, g);
    }
    return [...groups.values()].sort((a, b) => b.requests - a.requests);
  }

  function renderActivity() {
    const t = state.telemetry;
    const m = t?.available ? t.metrics : null;
    if (!m) return section('Activity', telemetryReason(), null);
    const callers = Array.isArray(m.caller_ips) ? m.caller_ips : [];
    const events = Array.isArray(m.recent_requests) ? m.recent_requests.slice().reverse() : [];
    const refused = state.status.relay_refused || [];
    const suspects = new Map((m.lockdown_candidates || []).map(row => [row.ip, row]));
    const query = state.query.trim().toLowerCase();
    const statusByIp = new Map(callers.map(row => [row.ip, row.status]));
    const inCountry = ip => !state.country || state.countries[ip] === state.country;
    const matchCaller = row => (state.filter === 'all' || row.status === state.filter) && inCountry(row.ip) && (!query || row.ip.toLowerCase().includes(query)
      || (state.locations[row.ip] || '').toLowerCase().includes(query) || (row.devices || []).some(d => d.toLowerCase().includes(query)));
    const rows = callers.filter(matchCaller);
    const shown = rows.slice(0, state.callerShown);
    const filteredEvents = events.filter(event => {
      const ip = typeof event.ip === 'string' ? event.ip : '';
      if (state.problems && num(event.status) < 400) return false;
      return (!query || ip.toLowerCase().includes(query) || String(event.route || '').toLowerCase().includes(query))
        && inCountry(ip) && (state.filter === 'all' || (statusByIp.get(ip) || 'unknown') === state.filter);
    });
    const loc = ip => state.locations[ip] || null;
    const groups = countriesReady() ? countryGroups(callers) : [];

    const search = el('input', {type: 'search', id: 'activity-search', placeholder: 'Filter by address, place, device or path', value: state.query,
      'aria-label': 'Filter activity', oninput: e => {
        state.query = e.target.value; state.callerShown = 25; render();
        const input = document.getElementById('activity-search');
        if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
      }});
    const countryPick = groups.length || state.country ? el('select', {'aria-label': 'Country', id: 'activity-country',
      onchange: e => { state.country = e.target.value; state.callerShown = 25; render(); }},
      el('option', {value: '', selected: !state.country}, 'All countries'),
      groups.map(g => el('option', {value: g.code, selected: g.code === state.country}, `${countryName(g.code)} (${g.callers})`))) : null;

    const callerRow = row => {
      const pick = () => openCaller(row.ip);
      const block = blockedRow(row.ip);
      const suspect = suspects.get(row.ip);
      const stop = e => e.stopPropagation();
      // One chip: the most important thing about this address.
      const status = block ? chip(block.cidr === row.ip ? 'Blocked' : `Blocked by ${block.cidr}`, 'bad')
        : suspect ? chip([suspect.denied_10m ? `${suspect.denied_10m} denied` : null,
            suspect.logins_10m ? plural(suspect.logins_10m, 'login') : null].filter(Boolean).join(' · '), 'warn', 'Denied answers and login attempts in the last 10 minutes')
        : row.status === 'authenticated' ? chip('Signed in', 'ok', `Signed in to Home Assistant ${ago(row.authenticated_at)} (${exact(row.authenticated_at)})`)
        : chip('Not signed in', '', 'This address made requests but never completed a Home Assistant sign-in');
      return el('div', {class: `row nowrap clickable${state.caller === row.ip ? ' selected' : ''}`, tabindex: '0', role: 'button',
        'aria-label': `Details for ${row.ip}`, onclick: pick,
        onkeydown: e => e.target === e.currentTarget && (e.key === 'Enter' || e.key === ' ') && (e.preventDefault(), pick())},
        el('div', {class: 'grow'},
          el('div', {class: 'title mono'}, countryTag(state.countries[row.ip]), row.ip,
            row.ip === state.myIp ? chip('You', 'info', 'The address this browser is using') : null),
          el('div', {class: 'sub', title: row.first_seen ? `First seen ${exact(row.first_seen)}` : null},
            [loc(row.ip), (row.devices || []).join(', '), plural(num(row.requests), 'request'), `last seen ${ago(row.last_seen)}`].filter(Boolean).join(' · '))),
        el('div', {class: 'side'}, status,
        block
          ? el('button', {class: 'btn text', disabled: state.busy, onclick: e => { stop(e); unblock(block.cidr); }, onkeydown: stop}, 'Unblock')
          : el('button', {class: 'btn text danger icon-only', disabled: state.busy, onclick: e => { stop(e); blockAddress(row.ip, row.status === 'authenticated'); },
            onkeydown: stop, 'aria-label': `Block ${row.ip}`, title: `Block ${row.ip}`}, icon(ICONS.block))));
    };

    const eventRow = event => requestRow(event);
    const reason = code => code === 'origin' ? ['From another website', 'The browser page that opened it wasn’t your public address.']
      : ['Path not allowed', 'Only Home Assistant’s WebSocket and app web UI sockets go through.'];
    const refusedRow = row => el('div', {class: 'row dense'},
      el('div', {class: 'grow'}, el('div', {class: 'title mono path'}, row.route),
        el('div', {class: 'sub'}, [isIp(row.ip) ? row.ip : 'IP unavailable', state.locations[row.ip], ago(row.at)].filter(Boolean).join(' · '))),
      chip(reason(row.reason)[0], 'warn', reason(row.reason)[1]));

    const filtered = query || state.filter !== 'all' || state.country;
    const VIEWS = [['callers', `Callers ${filtered ? `${rows.length}/` : ''}${callers.length}`],
      ['requests', `Requests ${filtered || state.problems ? `${filteredEvents.length}/` : ''}${events.length}`],
      ...(refused.length ? [['refused', `Refused ${refused.length}`]] : [])];
    const view = VIEWS.some(([id]) => id === state.view) ? state.view : 'callers';
    const csv = view === 'callers' && callers.length ? () => exportCallers(m) : view === 'requests' && events.length ? () => exportRequests(m) : null;

    let body;
    if (view === 'callers') {
      body = [shown.length ? shown.map(callerRow) : el('div', {class: 'empty'}, callers.length ? 'No callers match this filter.' : 'No one has called the public URL yet.'),
        rows.length > shown.length ? el('div', {class: 'row'}, el('div', {class: 'grow sub'}, `Showing ${shown.length} of ${rows.length}`),
          el('button', {class: 'btn text', onclick: () => { state.callerShown += 25; render(); }}, 'Show more')) : null,
        el('div', {class: 'foot'}, m.caller_ip_history_ok === false ? 'History storage is unavailable; addresses are kept in memory only.'
          : `Kept privately in Home Assistant for ${m.caller_ip_retention_days || 30} days. Tap an address for details.`)];
    } else if (view === 'requests') {
      body = filteredEvents.length ? filteredEvents.map(eventRow)
        : el('div', {class: 'empty'}, !events.length ? 'No requests yet.' : state.problems ? 'No denied or failed requests among the last 20.' : 'No requests match this filter.');
    } else {
      body = [refused.map(refusedRow), el('div', {class: 'foot'}, 'WebSockets the relay turned away. If an app’s web UI doesn’t load through the tunnel, its socket shows up here.')];
    }

    return [
      el('div', {class: 'toolbar'},
        el('div', {class: 'toolbar-row nowrap'}, search,
          el('button', {class: 'btn', id: 'refresh-activity', onclick: () => { refreshTelemetry(); refreshBlocks(); }, 'aria-label': 'Refresh', title: 'Refresh'}, icon(ICONS.refresh))),
        el('div', {class: 'toolbar-row'},
          segmented(CALLER_FILTERS, state.filter, value => { state.filter = value; state.callerShown = 25; render(); }, 'Caller filter'),
          countryPick)),
      el('section', {class: 'card'},
        el('div', {class: 'head'},
          el('div', {class: 'grow'}, segmented(VIEWS, view, value => { state.view = value; render(); }, 'Show')),
          view === 'requests' ? el('button', {class: `btn text${state.problems ? ' on' : ''}`, 'aria-pressed': String(state.problems),
            title: 'Only show denied and failed requests (4xx and 5xx)', onclick: () => { state.problems = !state.problems; render(); }},
            el('span', {class: `box${state.problems ? ' checked' : ''}`, 'aria-hidden': 'true'}), 'Problems only') : null,
          csv ? el('button', {class: 'btn text', onclick: csv, title: 'Export as CSV'}, icon(ICONS.download), 'CSV') : null),
        body),
    ];
  }

  const statusTone = code => code >= 500 ? 'bad' : code >= 400 ? 'warn' : code >= 300 ? 'info' : 'ok';
  function requestRow(event, showIp = true) {
    return el('div', {class: 'row dense'},
      chip(event.method || '—', 'method'),
      el('div', {class: 'grow'},
        el('div', {class: 'title mono path'}, event.route || '/'),
        el('div', {class: 'sub'}, [showIp ? (isIp(event.ip) ? event.ip : 'IP unavailable') : null, showIp ? state.locations[event.ip] : null,
          event.duration_ms != null ? `${fmt(event.duration_ms)} ms` : null,
          event.observed_at ? ago(event.observed_at) : null].filter(Boolean).join(' · '))),
      chip(String(event.status ?? '—'), statusTone(num(event.status))));
  }

  function openCaller(ip) {
    state.caller = ip;
    render();
    document.getElementById('panel-close')?.focus();
  }
  function closeCaller() {
    const ip = state.caller;
    state.caller = null;
    render();
    [...document.querySelectorAll('.row.clickable[aria-label]')].find(row => row.getAttribute('aria-label') === `Details for ${ip}`)?.focus();
  }

  // Everything about one caller, with block controls.
  function renderCallerPanel() {
    const m = state.telemetry?.available ? state.telemetry.metrics : null;
    const ip = state.caller;
    const row = (m?.caller_ips || []).find(r => r.ip === ip);
    if (!row) { state.caller = null; return null; }
    const block = blockedRow(ip);
    const suspect = (m.lockdown_candidates || []).find(r => r.ip === ip);
    const requests = (m.recent_requests || []).filter(e => e.ip === ip).slice().reverse();
    const code = state.countries[ip];
    const signedIn = row.status === 'authenticated';
    const kv = (label, value, tone) => value ? el('div', {}, el('div', {class: 'sub', style: 'margin:0'}, label),
      el('div', {class: `title${tone ? ` tone-${tone}` : ''}`}, value)) : null;
    return el('div', {class: 'overlay', onclick: e => { if (e.target === e.currentTarget) closeCaller(); }},
      el('aside', {class: 'panel', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'panel-title'},
        el('div', {class: 'panel-head'},
          el('div', {class: 'grow'}, el('h2', {id: 'panel-title', class: 'mono'}, countryTag(code), ip,
            ip === state.myIp ? chip('You', 'info', 'The address this browser is using') : null)),
          el('button', {class: 'btn text', onclick: () => copy(ip, 'Address'), 'aria-label': 'Copy address', title: 'Copy address'}, icon(ICONS.copy)),
          el('button', {class: 'btn text', id: 'panel-close', onclick: closeCaller, 'aria-label': 'Close', title: 'Close'}, '×')),
        el('div', {class: 'panel-body'},
          el('div', {class: 'kv', style: 'padding-top:12px'},
            kv('Status', block ? 'Blocked' : signedIn ? 'Signed in to Home Assistant' : 'Never signed in', block ? 'bad' : signedIn ? '' : 'warn'),
            kv('Country', code ? `${countryName(code)} (${code})` : countriesReady() ? 'Unknown' : null),
            kv('Place', state.locations[ip] || null),
            kv('Requests', fmt(row.requests)),
            kv('Last sign-in', signedIn ? exact(row.authenticated_at) : null),
            kv('First seen', row.first_seen ? exact(row.first_seen) : null),
            kv('Last seen', row.last_seen ? exact(row.last_seen) : null),
            suspect ? kv('Last 10 minutes', [suspect.denied_10m ? `${suspect.denied_10m} denied` : null,
              suspect.logins_10m ? plural(suspect.logins_10m, 'login attempt') : null].filter(Boolean).join(', '), 'warn') : null),
          (row.devices || []).length ? el('div', {class: 'pad'}, el('div', {class: 'sub', style: 'margin:0 0 6px'}, 'Devices'),
            el('div', {class: 'chips', style: 'margin:0'}, row.devices.map(device => chip(device, 'info')))) : null,
          block
            ? el('div', {class: 'row'}, el('div', {class: 'grow'}, el('div', {class: 'title tone-bad'}, block.cidr === ip ? 'Blocked' : `Blocked by the range ${block.cidr}`),
                el('div', {class: 'sub'}, [block.reason, until(block.until)].filter(Boolean).join(' · '))),
              el('button', {class: 'btn', disabled: state.busy, onclick: () => unblock(block.cidr)}, block.cidr === ip ? 'Unblock' : 'Unblock range'))
            : el('div', {class: 'row'},
              el('div', {class: 'grow'}, el('div', {class: 'title'}, 'Block this address'),
                el('div', {class: 'sub'}, 'The relay turns it away before it reaches Home Assistant.')),
              el('select', {id: 'panel-minutes', 'aria-label': 'Block for', onchange: e => { state.blockMinutes = e.target.value; }},
                BLOCK_DURATIONS.map(([value, text]) => el('option', {value, selected: value === state.blockMinutes}, text))),
              el('button', {class: 'btn danger', disabled: state.busy, onclick: () => blockAddress(ip, signedIn, Number(state.blockMinutes) || null)}, icon(ICONS.block), 'Block')),
          el('div', {class: 'group'}, requests.length ? `Recent requests · ${requests.length}` : 'Recent requests'),
          requests.length ? requests.map(event => requestRow(event, false))
            : el('div', {class: 'empty'}, 'None of the last 20 requests came from this address.'))));
  }

  // ----- Security -----
  function renderSecurity() {
    return [renderBlocks(), renderCountryRule(), renderLockdown()];
  }

  function renderBlocks() {
    const b = state.blocks;
    const rows = b?.blocks || [];
    const sync = b?.sync || {};
    const syncText = !state.status?.paired ? 'Enforced by the relay once Home Tunnel is paired.'
      : sync.ok === true ? `The relay turns these away before they reach Home Assistant. Checked ${sync.at ? ago(new Date(sync.at * 1000).toISOString()) : 'recently'}.`
      : sync.error === 'relay_too_old' ? 'The relay is too old to enforce blocks. Update it to 0.5.0 or newer.'
      : sync.ok === false ? 'Couldn’t update the relay’s block list. Retrying.'
      : 'Sending the list to the relay…';
    const source = row => row.source === 'auto' ? 'Automatic' : row.source === 'country' ? 'Country' : 'Manual';
    const form = el('form', {class: 'inline-form', onsubmit: e => { e.preventDefault(); blockAddress(state.blockCidr.trim(), false, Number(state.blockMinutes) || null); }},
      el('input', {type: 'text', id: 'block-cidr', 'aria-label': 'Address or range to block', placeholder: 'Block an address or range, e.g. 203.0.113.0/24',
        value: state.blockCidr, autocomplete: 'off', spellcheck: 'false', oninput: e => { state.blockCidr = e.target.value; }}),
      el('select', {id: 'block-minutes', 'aria-label': 'Block for', onchange: e => { state.blockMinutes = e.target.value; }},
        BLOCK_DURATIONS.map(([value, text]) => el('option', {value, selected: value === state.blockMinutes}, text))),
      el('button', {class: 'btn primary', type: 'submit', disabled: state.busy}, 'Block'));
    return el('section', {class: 'card'},
      el('div', {class: 'head'}, el('div', {class: 'grow'}, el('h2', {}, rows.length ? `Blocked addresses · ${rows.length}` : 'Blocked addresses'),
        el('p', {class: sync.ok === false && rows.length ? 'warn' : ''}, syncText))),
      rows.length ? rows.map(row => el('div', {class: 'row'},
        el('div', {class: 'grow'}, el('div', {class: 'title mono'}, row.cidr),
          el('div', {class: 'sub', title: `Added ${exact(new Date(row.created * 1000).toISOString())}`}, [source(row), row.reason, until(row.until)].filter(Boolean).join(' · '))),
        el('button', {class: 'btn text', disabled: state.busy, onclick: () => unblock(row.cidr)}, 'Unblock')))
        : el('div', {class: 'empty'}, 'Nothing is blocked.'),
      form);
  }

  async function blockAddress(cidr, signedIn = false, minutes = 1440) {
    if (!cidr) { say('Enter an address or range to block.', true); render(); return; }
    const mine = state.myIp && cidrContains(cidr, state.myIp);
    const warning = mine ? `You are using ${state.myIp} right now. Blocking ${cidr} cuts this browser off from Home Assistant until you unblock it from your home network. Block it anyway?`
      : signedIn ? `${cidr} has signed in to Home Assistant before. Block it anyway?`
      : null;
    if (warning && !confirm(warning)) return;
    await act(async () => {
      state.blocks = await api('blocks', {cidr, minutes});
      state.blockCidr = '';
    }, `Blocked ${cidr}.`);
  }

  async function unblock(cidr) {
    await act(async () => { state.blocks = await api('blocks/remove', {cidr}); }, `Unblocked ${cidr}.`);
  }

  async function clearHistory() {
    if (!confirm('Clear all stored caller addresses? This can’t be undone.')) return;
    await act(async () => { await api('caller-ips/clear', {}); await refreshTelemetry(); }, 'Caller history cleared.');
  }

  // Whether a country rule blocks callers from this country (travel mode lets a country through).
  function ruleBlocks(policy, code) {
    if (!code || policy.mode === 'off' || travelling(code)) return false;
    return policy.mode === 'block' ? policy.codes.includes(code) : !policy.codes.includes(code);
  }
  const nameList = codes => {
    const names = codes.map(countryName);
    return names.length <= 1 ? (names[0] || '') : `${names.slice(0, -1).join(', ')} and ${names[names.length - 1]}`;
  };
  // Callers from the last 30 days that a rule would block.
  function ruleImpact(policy) {
    const callers = state.telemetry?.metrics?.caller_ips || [];
    const hit = callers.filter(row => ruleBlocks(policy, state.countries[row.ip]));
    return {callers: hit.length, signedIn: hit.filter(row => row.status === 'authenticated').length,
      countries: [...new Set(hit.map(row => state.countries[row.ip]))]};
  }

  function renderCountryRule() {
    const s = state.status;
    const c = s.countries || {mode: 'off', codes: [], minutes: 43200};
    if (!countriesReady()) {
      return section('Country rule', 'Starts working once the country database has downloaded. Its status is in Settings.', null);
    }
    const allow = c.mode === 'allow';
    const add = code => {
      state.countryPick = '';
      if (!code) return;
      saveCountries({...c, codes: [...c.codes, code]}, allow ? `${countryName(code)} is allowed.` : c.mode === 'block' ? `${countryName(code)} is blocked.` : `${countryName(code)} added.`);
    };
    const remove = code => {
      const codes = c.codes.filter(x => x !== code);
      if (allow && !codes.length) {
        if (!confirm(`${countryName(code)} is the only allowed country. Removing it turns the country rule off. Continue?`)) return;
        return saveCountries({...c, codes, mode: 'off'}, 'Country rule is off.');
      }
      saveCountries({...c, codes}, allow ? `${countryName(code)} is no longer allowed.` : c.mode === 'block' ? `${countryName(code)} is no longer blocked.` : `${countryName(code)} removed.`);
    };
    const switchMode = mode => {
      if (mode === c.mode) return;
      if (mode === 'allow' && !c.codes.length) { say('Add the countries to allow first, then pick Only allow these.', true); render(); return; }
      const lead = mode === 'allow' && c.codes.length
        ? `Only allow ${nameList(c.codes)}? Callers from every other country will be blocked.`
        : mode === 'block' && c.mode === 'allow' && c.codes.length
          ? `Block ${nameList(c.codes)}? They stop being the allowed countries and become the blocked ones; every other country gets through.`
          : null;
      saveCountries({...c, mode}, mode === 'off' ? 'Country rule is off. Its blocks were lifted.' : 'Country rule saved.', lead);
    };
    const available = COUNTRY_CODES.filter(code => !c.codes.includes(code))
      .map(code => [code, countryName(code)]).sort((x, y) => x[1].localeCompare(y[1]));
    const myCountry = state.myIp ? state.countries[state.myIp] : null;
    const selfRisk = ruleBlocks(c, myCountry);
    const m = state.telemetry?.available ? state.telemetry.metrics : null;
    const seen = countryGroups(Array.isArray(m?.caller_ips) ? m.caller_ips : []).filter(g => !c.codes.includes(g.code)).slice(0, 8);
    const impact = ruleImpact(c);
    const summary = c.mode === 'off' ? 'Off. Nothing is blocked by country.'
      : !c.codes.length ? 'Add the countries to block.'
      : c.mode === 'block' ? `Blocking ${nameList(c.codes)}. Every other country gets through.`
      : `Only ${nameList(c.codes)} ${c.codes.length === 1 ? 'gets' : 'get'} through. Every other country is blocked.`;
    const effectText = c.mode === 'off' ? null : impact.callers
      ? `${plural(impact.callers, 'caller')} seen in the last 30 days ${impact.callers === 1 ? 'is' : 'are'} blocked by this rule${impact.signedIn ? `, including ${impact.signedIn} that signed in to Home Assistant` : ''}.`
      : 'No caller seen in the last 30 days is blocked by this rule.';
    const listLabel = c.mode === 'allow' ? 'Allowed countries' : c.mode === 'block' ? 'Blocked countries' : 'Saved countries, not applied while the rule is off';
    return section('Country rule', summary,
      segmented(COUNTRY_MODES, c.mode, switchMode, 'Country rule'),
      selfRisk ? el('div', {class: 'pad'}, el('div', {class: 'notice', role: 'alert', style: 'margin:0'},
        el('div', {class: 'grow'}, el('div', {class: 'title'}, 'This rule blocks you'),
          el('div', {class: 'sub'}, `You are connecting from ${countryName(myCountry)}. This browser is cut off until you change the rule from your home network.`)))) : null,
      el('div', {class: 'row'},
        el('div', {class: 'grow'}, el('div', {class: 'sub', style: 'margin:0 0 6px'}, listLabel),
          el('div', {class: 'chips'},
            c.codes.map(code => el('span', {class: `chip ${allow ? 'ok' : c.mode === 'block' ? 'bad' : ''}`}, countryTag(code), countryName(code),
              el('button', {class: 'chip-x', type: 'button', 'aria-label': `Remove ${countryName(code)}`, title: 'Remove', disabled: state.busy,
                onclick: () => remove(code)}, '×'))),
            el('select', {id: 'country-pick', class: 'chip-select', 'aria-label': allow ? 'Allow a country' : 'Block a country', disabled: state.busy, onchange: e => add(e.target.value)},
              el('option', {value: '', selected: true}, allow ? '+ Allow a country' : c.mode === 'block' ? '+ Block a country' : '+ Add a country'),
              available.map(([code, name]) => el('option', {value: code}, `${name} (${code})`)))),
          effectText ? el('div', {class: `sub${impact.signedIn ? ' warn' : ''}`, style: 'margin-top:8px'}, effectText) : null)),
      seen.length ? el('div', {class: 'row'},
        el('div', {class: 'grow'}, el('div', {class: 'sub', style: 'margin:0 0 6px'}, allow ? 'Allow a country your callers came from' : 'Block a country your callers came from'),
          el('div', {class: 'chips'}, seen.map(g => el('button', {class: `chip chip-btn${allow ? '' : ' danger-chip'}`, type: 'button', disabled: state.busy,
            title: `${plural(g.callers, 'caller')}, ${plural(g.requests, 'request')}`, onclick: () => add(g.code)},
            allow ? 'Allow ' : 'Block ', countryTag(g.code), countryName(g.code), el('span', {class: 'count'}, plural(g.callers, 'caller'))))))) : null,
      c.mode !== 'off' ? renderTravel() : null,
      c.mode !== 'off' ? el('div', {class: 'row'},
        el('div', {class: 'grow'}, el('div', {class: 'title'}, 'Block for'),
          el('div', {class: 'sub'}, 'Applies to every address, signed in or not, about 15 seconds after its first request. Changing the rule lifts blocks it no longer wants at once.')),
        el('select', {id: 'country-minutes', disabled: state.busy, 'aria-label': 'Block for', onchange: e => saveCountries({...c, minutes: Number(e.target.value) || null}, 'Saved.')},
          BLOCK_DURATIONS.filter(([value]) => value !== '60').map(([value, text]) =>
            el('option', {value, selected: String(c.minutes ?? '') === value}, text)))) : null);
  }

  const travelling = code => (state.status?.travel || []).some(t => t.code === code && t.until * 1000 > Date.now());

  // Allow a country for a while; it turns itself off.
  function renderTravel() {
    const travel = (state.status.travel || []).filter(t => t.until * 1000 > Date.now());
    const options = COUNTRY_CODES.filter(code => !travel.some(t => t.code === code))
      .map(code => [code, countryName(code)]).sort((a, b) => a[1].localeCompare(b[1]));
    const left = t => `${duration(t.until - Date.now() / 1000)} left`;
    return el('div', {class: 'row'},
      el('div', {class: 'grow'}, el('div', {class: 'title'}, 'Travel mode'),
        el('div', {class: 'sub'}, travel.length
          ? 'The rule doesn’t block these countries until their time runs out. Their country blocks were lifted.'
          : 'Going away? Let a country through for a while; it turns itself off.'),
        travel.length ? el('div', {class: 'chips'}, travel.map(t => el('span', {class: 'chip info', title: `Until ${exact(new Date(t.until * 1000).toISOString())}`},
          countryTag(t.code), `${countryName(t.code)} · ${left(t)}`,
          el('button', {class: 'chip-x', type: 'button', 'aria-label': `End travel mode for ${countryName(t.code)}`, title: 'End now', disabled: state.busy,
            onclick: () => saveTravel(travel.filter(x => x.code !== t.code), `Travel mode for ${countryName(t.code)} ended.`)}, '×')))) : null,
        el('div', {class: 'actions', style: 'margin-top:8px'},
          el('select', {id: 'travel-pick', 'aria-label': 'Country to let through', onchange: e => { state.travelPick = e.target.value; }},
            el('option', {value: '', selected: !state.travelPick}, 'Pick a country…'),
            options.map(([code, name]) => el('option', {value: code, selected: code === state.travelPick}, `${name} (${code})`))),
          el('select', {id: 'travel-days', 'aria-label': 'For how long', onchange: e => { state.travelDays = e.target.value; }},
            TRAVEL_DAYS.map(([value, text]) => el('option', {value, selected: value === state.travelDays}, text))),
          el('button', {class: 'btn', disabled: state.busy, onclick: () => {
            const code = state.travelPick;
            if (!code) { say('Pick the country you’re going to.', true); render(); return; }
            const until = Math.floor(Date.now() / 1000) + Number(state.travelDays) * 86400;
            state.travelPick = '';
            saveTravel([...travel.filter(t => t.code !== code), {code, until}],
              `${countryName(code)} is let through for ${TRAVEL_DAYS.find(([v]) => v === state.travelDays)[1]}.`);
          }}, 'Let through'))));
  }

  async function saveTravel(travel, done) {
    await act(async () => { await api('settings', {travel}); await refreshBlocks(); refreshTimeline(); }, done);
  }

  // What the relay and connector let through. Fixed in their code on purpose: shown, not editable.
  function renderLockdown() {
    const saved = state.status.lockdown;
    const draft = state.lockdownDraft || (state.lockdownDraft = {...saved});
    const numberField = (key, label, min, max) => el('div', {style: 'min-width:150px'},
      el('label', {class: 'field', for: `lock-${key}`}, label),
      el('input', {type: 'number', id: `lock-${key}`, min: String(min), max: String(max), step: '1', value: String(draft[key]),
        style: 'width:100%', oninput: e => { draft[key] = e.target.value; }}));
    return el('section', {class: 'card'},
      toggleRow('Automatic lockdown', saved.enabled
        ? `Blocks an address for ${duration(num(saved.minutes) * 60)} after ${saved.denied} denied answers or ${saved.logins} login attempts in 10 minutes. Signed-in addresses are never blocked automatically.`
        : 'Off: noisy addresses are only reported. Home Assistant’s own IP ban can’t work behind the tunnel.', saved.enabled, on => saveLockdown({...saved, enabled: on}), state.busy, '', true),
      saved.enabled ? more('lockdown', 'Change thresholds',
        el('form', {onsubmit: e => { e.preventDefault(); saveLockdown({...saved, denied: Number(draft.denied), logins: Number(draft.logins), minutes: Number(draft.minutes)}); }},
          el('div', {class: 'fields'},
            numberField('denied', 'Denied answers in 10 min', 5, 1000),
            numberField('logins', 'Login attempts in 10 min', 5, 1000),
            numberField('minutes', 'Block for (minutes)', 5, 10080),
            el('div', {style: 'flex:0 0 auto;min-width:0'}, el('button', {class: 'btn primary', type: 'submit', disabled: state.busy}, 'Save'))),
          el('div', {class: 'pad sub', style: 'margin-top:-6px'}, 'A login takes 2 to 3 attempts, so 15 attempts is about 5 failed logins.'))) : null);
  }

  // ----- Settings -----
  function renderSettings() {
    const s = state.status;
    const latestDev = /-dev(?:\.|$)/i.test(s.latest_relay_version || '');
    const features = s.relay_features || [];
    let relayStatus, relayTone;
    if (!s.relay_version) { relayStatus = s.paired ? 'Waiting for the relay to report its version' : 'Not paired'; relayTone = ''; }
    else if (!s.latest_relay_version) { relayStatus = 'Release information isn’t available yet'; relayTone = ''; }
    else if (latestDev) { relayStatus = `Development build ${s.latest_relay_version} is the latest`; relayTone = 'info'; }
    else if (s.relay_update_available) { relayStatus = `Update available: ${s.latest_relay_version}`; relayTone = 'warn'; }
    else { relayStatus = 'Up to date'; relayTone = 'ok'; }
    const link = (href, text) => href ? el('a', {class: 'btn text', href, target: '_blank', rel: 'noopener noreferrer'}, text, icon(ICONS.open)) : null;
    const health = s.relay_health || {};
    const certificate = health.certificate_error === 'not_trusted' ? ['Not trusted by this system', 'bad']
      : health.certificate_error ? ['Couldn’t be checked', 'warn']
      : typeof health.certificate_days_left === 'number'
        ? [`Expires in ${plural(health.certificate_days_left, 'day')} (${new Date(health.certificate_expires_at * 1000).toLocaleDateString([], {dateStyle: 'medium'})})${health.certificate_issuer ? ` · ${health.certificate_issuer}` : ''}`,
          health.certificate_days_left < 14 ? 'warn' : '']
        : ['Checked after pairing', ''];
    const needsRelay = feature => features.includes(feature) ? null : 'Needs relay 0.5.0 or newer.';
    const callers = state.telemetry?.metrics?.caller_ips || [];

    return [
      section('Relay', s.paired ? s.relay_url : 'Not paired', null,
        s.paired ? factRow('Connection', s.relay_latency_ms != null ? `${fmt(s.relay_latency_ms)} ms` : '—',
          `HTTPS certificate: ${certificate[0].charAt(0).toLowerCase()}${certificate[0].slice(1)}`, certificate[1]) : null,
        el('div', {class: 'row'},
          el('div', {class: 'grow'}, el('div', {class: 'title'}, 'Versions'),
            el('div', {class: 'sub'}, `Relay ${s.relay_version || '—'} · app ${s.home_tunnel_version || 'unknown'}`),
            s.relay_compatible === false ? el('div', {class: 'sub warn'}, 'Compatibility with this app version isn’t confirmed.') : null),
          chip(relayStatus, relayTone)),
        more('relay-links', 'Release notes and update guide',
          el('div', {class: 'pad sub'}, `The app updates through Home Assistant; the relay is updated by hand on the IIS host.${s.release_checked_at ? ` Releases checked ${ago(new Date(s.release_checked_at * 1000).toISOString())}.` : ''}`),
          el('div', {class: 'pad actions', style: 'padding-top:0'},
            link(s.release_url, 'Releases'), link(s.changelog_url, 'Changelog'), link(s.manual_update_url, 'Relay update guide')))),

      renderNotifications(),
      renderLocations(),

      section('Maintenance', null, null,
        s.paired ? el('div', {class: 'row'},
          el('div', {class: 'grow'}, el('div', {class: 'title'}, 'Rotate the connector key'),
            el('div', {class: `sub${needsRelay('rotate') ? ' warn' : ''}`}, needsRelay('rotate') ||
              (s.rotation_pending ? 'A new key is waiting for the relay to confirm it.' : 'The tunnel reconnects in a few seconds.'))),
          el('button', {class: 'btn', disabled: state.busy || !!needsRelay('rotate'), onclick: rotateKey}, icon(ICONS.key), 'Rotate')) : null,
        el('div', {class: 'row'},
          el('div', {class: 'grow'}, el('div', {class: 'title'}, 'Clear caller history'),
            el('div', {class: 'sub'}, 'Forgets every stored caller address and sign-in marker. Blocks stay. Can’t be undone.')),
          el('button', {class: 'btn danger', disabled: state.busy || !callers.length, onclick: clearHistory}, icon(ICONS.delete), 'Clear')),
        s.paired ? el('div', {class: 'row'},
          el('div', {class: 'grow'}, el('div', {class: 'title'}, 'Unpair'),
            el('div', {class: 'sub'}, 'Stops the tunnel; this app and the relay forget each other. Pairing again needs a new setup code.')),
          el('button', {class: 'btn danger', disabled: state.busy, onclick: unpairRelay}, icon(ICONS.delete), 'Unpair')) : null),
    ];
  }

  function renderNotifications() {
    const s = state.status;
    const n = s.notifications;
    if (!s.notifications_available) {
      return section('Notifications', null, null, el('div', {class: 'row'}, el('div', {class: 'grow sub warn'},
        'Home Assistant didn’t give this app API access, so it can’t send notifications. Restart the app after updating it; if this stays, reinstall it.')));
    }
    if (state.targets == null) loadTargets();
    const targets = state.targets?.targets || ['persistent_notification'];
    const label = target => target === 'persistent_notification' ? 'Home Assistant notifications (bell)' : target.replace(/^notify\./, 'Notify: ');
    const save = changes => saveNotifications({...n, ...changes});
    const on = NOTIFY_EVENTS.filter(([key]) => n.events[key]).length;
    return section('Notifications', null, null,
      el('div', {class: 'row'},
        el('select', {id: 'notify-target', class: 'grow', 'aria-label': 'Send notifications to', disabled: state.busy, onchange: e => save({target: e.target.value})},
          el('option', {value: '', selected: !n.target}, 'Don’t send notifications'),
          [...new Set([...targets, ...(n.target ? [n.target] : [])])].map(target => el('option', {value: target, selected: target === n.target}, label(target)))),
        el('button', {class: 'btn', disabled: state.busy || !n.target, onclick: testNotification}, 'Send test')),
      state.targets?.error ? el('div', {class: 'pad sub warn'}, 'Couldn’t list notify services from Home Assistant; only the built-in option is shown.') : null,
      n.target ? more('notify', `Alerts · ${on} of ${NOTIFY_EVENTS.length} on`, NOTIFY_EVENTS.map(([key, title, sub]) => toggleRow(title, sub, !!n.events[key],
        value => save({events: {...n.events, [key]: value}}), state.busy))) : null);
  }

  async function loadTargets() {
    state.targets = {targets: ['persistent_notification'], error: null, loading: true};
    try { state.targets = await api('notify/targets'); } catch (error) { state.targets = {targets: ['persistent_notification'], error: 'unreachable'}; }
    render();
  }

  async function saveLockdown(value) {
    await act(async () => { await api('settings', {lockdown: value}); state.lockdownDraft = null; },
      value.enabled ? 'Automatic lockdown saved.' : 'Automatic lockdown is off.');
  }

  async function saveNotifications(value) {
    await act(() => api('settings', {notifications: value}), value.target ? 'Notification settings saved.' : 'Notifications are off.');
  }

  async function testNotification() {
    await act(() => api('notify/test', {target: state.status.notifications.target}), 'Test notification sent.');
  }

  async function rotateKey() {
    if (!confirm('Rotate the connector key? The tunnel drops for a few seconds while the connector reconnects with the new key.')) return;
    await act(async () => {
      const result = await api('rotate-key', {});
      if (!result.rotated) throw new Error('The relay hasn’t confirmed the new key yet. Home Tunnel keeps trying; both keys work meanwhile.');
    }, 'Connector key rotated.');
  }

  async function unpairRelay() {
    const self = viaTunnel();
    if (!confirm(`${self ? 'You are using Home Assistant through the tunnel right now; this page will disconnect. ' : ''}Unpair from ${state.status.relay_url}? The tunnel stops, and pairing again needs a new setup code and web.config hash.`)) return;
    await act(async () => {
      try {
        await api('unpair', {});
      } catch (error) {
        if (!confirm(`${error.message}\n\nUnpair only here? The relay keeps its old pairing until you delete App_Data\\home-tunnel-state.json on the IIS host.`)) throw error;
        await api('unpair', {force: true});
      }
      state.tab = 'overview';
      history.replaceState(null, '', '#overview');
    }, 'Unpaired. Create a new setup code to pair again.');
  }

  // Countries come from an offline database; city names optionally from ipapi.co.
  const countriesReady = () => !!(state.status?.country_db?.available || state.status?.geolocation_enabled);

  function renderLocations() {
    const s = state.status;
    const db = s.country_db || {};
    const cities = !!s.geolocation_enabled;
    const edition = db.month ? new Date(`${db.month}-15T00:00:00Z`).toLocaleDateString([], {month: 'long', year: 'numeric'}) : null;
    return section('Locations', null, null,
      el('div', {class: 'row'},
        el('div', {class: 'grow'}, el('div', {class: 'title'}, 'Country data'),
          el('div', {class: `sub${db.available ? '' : ' warn'}`}, db.available
            ? `${edition} edition, updated ${ago(new Date(db.downloaded_at * 1000).toISOString())}. Looked up inside this app, so no address is sent anywhere.`
            : db.error === 'download_failed' ? 'Couldn’t download the country database. Retrying every 15 minutes.'
            : 'Downloading the country database (about 5 MB)…'),
          el('div', {class: 'sub'}, el('a', {href: 'https://db-ip.com', target: '_blank', rel: 'noopener noreferrer'}, 'IP geolocation by DB-IP'), ', CC BY 4.0.')),
        chip(db.available ? 'Ready' : db.error ? 'Unavailable' : 'Downloading', db.available ? 'ok' : 'warn')),
      toggleRow('Show city names',
        state.geoSaving ? 'Saving…' : 'Optional. Sends public caller addresses to ipapi.co for an approximate city. Countries don’t need this.',
        cities, setGeolocation, state.geoSaving),
      cities ? geoProblem(s.geolocation_status) : null);
  }

  function geoProblem(status) {
    if (!status) return null;
    if (status.remaining_today === 0) return el('div', {class: 'pad sub warn'}, 'Today’s 200 city lookups are used up. New addresses get a city again tomorrow.');
    if (status.error === 'rate_limited') return el('div', {class: 'pad sub warn'}, `ipapi.co is limiting city lookups (${ago(new Date(status.at * 1000).toISOString())}). Cities appear as it allows.`);
    if (status.error === 'failed') return el('div', {class: 'pad sub warn'}, `The last city lookup failed (${ago(new Date(status.at * 1000).toISOString())}). Failed addresses are retried after 15 minutes.`);
    return null;
  }

  // Saves a country rule, first saying plainly who it newly blocks.
  async function saveCountries(value, done = 'Country rule saved.', lead = null) {
    const current = state.status.countries;
    const mine = state.myIp ? state.countries[state.myIp] : null;
    const callers = state.telemetry?.metrics?.caller_ips || [];
    const newly = callers.filter(row => ruleBlocks(value, state.countries[row.ip]) && !ruleBlocks(current, state.countries[row.ip]));
    const signed = newly.filter(row => row.status === 'authenticated').length;
    const lines = [lead,
      ruleBlocks(value, mine) && !ruleBlocks(current, mine) ? `This blocks ${countryName(mine)}, where you are connecting from: this browser will be cut off until you change the rule from your home network.` : null,
      newly.length ? `${plural(newly.length, 'caller')} from ${nameList([...new Set(newly.map(row => state.countries[row.ip]))])} will be blocked within 15 seconds${signed ? `, including ${signed} that signed in to Home Assistant` : ''}.` : null,
    ].filter(Boolean);
    if (lines.length && !confirm(`${lines.join('\n\n')}\n\nSave the rule?`)) { render(); return; }
    let lifted = 0, ok = false;
    await act(async () => { lifted = (await api('settings', {countries: value})).lifted || 0; ok = true; await refreshBlocks(); });
    if (ok) { say(`${done}${lifted ? ` Lifted ${plural(lifted, 'existing block')}.` : ''}`); render(); }
  }

  async function setGeolocation(on, input) {
    state.geoSaving = true; render();
    try {
      await api('settings', {geolocation_enabled: on});
      state.status.geolocation_enabled = on;
      if (!on) state.locations = {};
      say(on ? 'City names turned on.' : 'City names turned off. Countries still show.');
      if (on) lookupLocations();
    } catch (error) {
      input.checked = !on;
      say(`Couldn’t save: ${error.message}`, true);
    }
    state.geoSaving = false; render();
  }


  // ---------- data ----------
  let lastStatusKey = '';
  async function refreshStatus() {
    try {
      state.status = await api('status');
      state.statusError = null;
    } catch (error) {
      state.statusError = error.message;
    }
    const key = JSON.stringify([state.status, state.statusError]);
    if (key !== lastStatusKey) { lastStatusKey = key; render(); }
  }

  async function refreshTelemetry() {
    try {
      state.telemetry = await api('telemetry');
    } catch (error) {
      state.telemetry = {available: false, reason: 'endpoint_unavailable'};
    }
    render();
    lookupLocations();
  }

  async function refreshHistory() {
    try { state.history = await api('history?minutes=1440'); } catch (error) { state.history = {available: false, fields: [], minutes: []}; }
    render();
  }

  async function refreshTimeline() {
    if (!state.status?.paired) return;
    try { state.timeline = await api('timeline'); render(); } catch (error) { /* keep the last one */ }
  }

  async function refreshBlocks() {
    try { state.blocks = await api('blocks'); } catch (error) { /* keep the last list */ }
    render();
  }

  // When this page is reached through the tunnel, ask the relay which address it sees,
  // so blocking yourself needs a second look.
  async function findMyIp() {
    if (!viaTunnel()) return;
    try {
      const response = await fetch('/_whoami.ashx', {cache: 'no-store', credentials: 'omit'});
      const data = await response.json();
      if (typeof data.ip === 'string') { state.myIp = data.ip; render(); }
    } catch (error) { /* only a convenience */ }
  }

  // Countries for every address (offline, so all at once); city names for up to 10 at a time when turned on.
  async function lookupLocations() {
    const m = state.telemetry?.available ? state.telemetry.metrics : null;
    if (!m || !countriesReady()) return;
    const cities = !!state.status.geolocation_enabled;
    const recent = (Array.isArray(m.recent_requests) ? m.recent_requests.slice().reverse() : []).map(e => e.ip);
    const callers = (Array.isArray(m.caller_ips) ? m.caller_ips : []).map(r => r.ip);
    const needed = ip => isIp(ip) && (!(ip in state.countries) || (cities && !(ip in state.locations)));
    const ips = [...new Set([...recent, ...callers])].filter(needed).slice(0, 50);
    if (!ips.length) return;
    try {
      // Repeated parameters: some hosting firewalls refuse a comma-separated list of IP addresses.
      const result = await api(`geolocation?${ips.map(ip => `ips=${encodeURIComponent(ip)}`).join('&')}`);
      for (const ip of ips) {
        state.countries[ip] = (result.countries || {})[ip] || '';
        if (result.enabled && ip in (result.locations || {})) state.locations[ip] = result.locations[ip] || '';
      }
      render();
    } catch (error) { /* locations are optional */ }
  }


  // ---------- start ----------
  syncTheme(); syncNarrow();
  render();
  refreshStatus().then(() => { findMyIp(); refreshTimeline(); }); refreshTelemetry(); refreshHistory(); refreshBlocks();
  setInterval(() => { if (!document.hidden) refreshStatus(); }, 3000);
  setInterval(() => { if (!document.hidden) refreshTelemetry(); }, 10000);
  setInterval(() => { if (!document.hidden) refreshTimeline(); }, 20000);
  setInterval(() => { if (!document.hidden) { refreshHistory(); refreshBlocks(); } }, 60000);
  setInterval(() => { syncTheme(); syncNarrow(); }, 2000);
  window.addEventListener('resize', syncNarrow);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { refreshStatus(); refreshTelemetry(); refreshHistory(); } });
})();

</script>
</body>
</html>
