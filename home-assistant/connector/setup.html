<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="ingress-base" content="__INGRESS_BASE__">
  <title>Home Tunnel</title>
  <style>
    /* Colours follow the Home Assistant theme: the page copies HA's theme variables from the
       parent frame (same origin under ingress). These are the fallbacks when it can't. */
    :root{
      --primary-background-color:#fafafa;--secondary-background-color:#f0f0f0;--card-background-color:#fff;
      --primary-text-color:#212121;--secondary-text-color:#727272;--divider-color:rgba(0,0,0,.12);
      --primary-color:#03a9f4;--rgb-primary-color:3,169,244;--text-primary-color:#fff;
      --app-header-background-color:var(--primary-background-color);--app-header-text-color:var(--primary-text-color);
      --success-color:#43a047;--rgb-success-color:67,160,71;--warning-color:#ffa600;--rgb-warning-color:255,166,0;
      --error-color:#db4437;--rgb-error-color:219,68,55;--disabled-color:#bdbdbd;
      --ha-card-border-radius:12px;--code-font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
      --ha-font-family-body:Roboto,"Segoe UI",Arial,sans-serif;
    }
    @media (prefers-color-scheme:dark){:root:not([data-themed]){
      --primary-background-color:#111;--secondary-background-color:#202020;--card-background-color:#1c1c1c;
      --primary-text-color:#e1e1e1;--secondary-text-color:#9b9b9b;--divider-color:rgba(225,225,225,.12);
      --disabled-color:#6f6f6f;color-scheme:dark;
    }}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%}
    body{background:var(--primary-background-color);color:var(--primary-text-color);font-family:var(--ha-font-family-body);font-size:14px;-webkit-font-smoothing:antialiased}
    a{color:var(--primary-color)}
    .top{position:sticky;top:0;z-index:2;background:var(--app-header-background-color);color:var(--app-header-text-color);border-bottom:1px solid var(--divider-color)}
    .bar{display:flex;align-items:center;gap:12px;height:56px;padding:0 16px;max-width:960px;margin:0 auto}
    .bar h1{font-size:20px;font-weight:400;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .ha-narrow .bar h1{visibility:hidden}
    .pill{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:500;background:var(--secondary-background-color);white-space:nowrap;max-width:60vw;overflow:hidden;text-overflow:ellipsis}
    .dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--disabled-color)}
    .ok .dot,.dot.ok{background:var(--success-color);box-shadow:0 0 0 3px rgba(var(--rgb-success-color),.25)}
    .warn .dot,.dot.warn{background:var(--warning-color);box-shadow:0 0 0 3px rgba(var(--rgb-warning-color),.25)}
    .bad .dot,.dot.bad{background:var(--error-color);box-shadow:0 0 0 3px rgba(var(--rgb-error-color),.25)}
    .tabs{display:flex;max-width:960px;margin:0 auto;padding:0 8px}
    .tabs button{border:0;background:none;color:var(--secondary-text-color);font:inherit;font-weight:500;padding:12px 16px;cursor:pointer;border-bottom:2px solid transparent;min-height:48px}
    .tabs button[aria-selected=true]{color:var(--primary-color);border-bottom-color:var(--primary-color)}
    main{max-width:960px;margin:0 auto;padding:16px 16px 64px}
    .intro{color:var(--secondary-text-color);margin:4px 4px 16px;line-height:1.45}
    .card{background:var(--card-background-color);border-radius:var(--ha-card-border-radius);border:1px solid var(--divider-color);margin:0 0 16px;overflow:hidden}
    .head{display:flex;gap:12px;align-items:flex-start;padding:16px 16px 12px}
    .head h2{font-size:17px;font-weight:500;margin:2px 0 4px}
    .head p{margin:0;font-size:14px;line-height:1.4;color:var(--secondary-text-color)}
    .icon{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(var(--rgb-primary-color),.15);color:var(--primary-color)}
    .icon.ok{background:rgba(var(--rgb-success-color),.15);color:var(--success-color)}
    .icon.warn{background:rgba(var(--rgb-warning-color),.15);color:var(--warning-color)}
    .icon.bad{background:rgba(var(--rgb-error-color),.15);color:var(--error-color)}
    .icon svg,.btn svg,.chev{width:24px;height:24px;fill:currentColor}
    .btn svg{width:18px;height:18px}
    .group{padding:16px 16px 4px;font-size:13px;font-weight:500;text-transform:uppercase;letter-spacing:.05em;color:var(--secondary-text-color);border-top:1px solid var(--divider-color)}
    .row{display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:52px;flex-wrap:wrap;border-top:1px solid var(--divider-color)}
    .head+.row,.group+.row,.head+.tiles{border-top:0}
    .grow{flex:1;min-width:140px}
    .title{font-weight:500;overflow-wrap:anywhere}
    .sub{font-size:13px;color:var(--secondary-text-color);overflow-wrap:anywhere;margin-top:2px;line-height:1.4}
    .sub.warn{color:var(--warning-color)}
    .sub.bad{color:var(--error-color)}
    .value{font-weight:500;text-align:right;overflow-wrap:anywhere}
    .mono{font-family:var(--code-font-family)}
    .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
    .chip{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--secondary-background-color);color:var(--secondary-text-color);white-space:nowrap}
    .chip.on,.chip.ok{background:rgba(var(--rgb-success-color),.15);color:var(--success-color)}
    .chip.warn{background:rgba(var(--rgb-warning-color),.15);color:var(--warning-color)}
    .chip.bad{background:rgba(var(--rgb-error-color),.15);color:var(--error-color)}
    .chip-x{border:0;background:none;color:inherit;font:inherit;font-size:14px;line-height:1;padding:0 0 0 6px;cursor:pointer}
    .chip.info{background:rgba(var(--rgb-primary-color),.15);color:var(--primary-color)}
    .method{font-family:var(--code-font-family);font-size:11px;font-weight:600;min-width:52px;text-align:center}
    select,input[type=text],input[type=url],input[type=search],input[type=number]{font:inherit;color:inherit;background:var(--secondary-background-color);border:1px solid var(--divider-color);border-radius:8px;padding:8px 10px;min-height:44px;max-width:100%;width:100%}
    select{width:auto}
    input:focus-visible,select:focus-visible{outline:2px solid var(--primary-color);outline-offset:1px}
    label.field{display:block;font-size:13px;color:var(--secondary-text-color);margin-bottom:6px}
    .btn{font:inherit;font-weight:500;border:1px solid var(--divider-color);background:var(--card-background-color);color:inherit;border-radius:8px;padding:8px 16px;min-height:40px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap}
    .btn.primary{background:var(--primary-color);border-color:var(--primary-color);color:var(--text-primary-color)}
    .btn.danger{color:var(--error-color)}
    .btn.text{border-color:transparent;background:none;color:var(--primary-color);padding:6px 10px;min-height:32px}
    .btn.text.danger{color:var(--error-color)}
    .btn:disabled{opacity:.5;cursor:default}
    .btn:focus-visible,.clickable:focus-visible,.tabs button:focus-visible,.seg button:focus-visible{outline:2px solid var(--primary-color);outline-offset:2px}
    .seg{display:inline-flex;border:1px solid var(--divider-color);border-radius:8px;overflow:hidden;flex:none}
    .seg button{font:inherit;font-size:14px;border:0;border-left:1px solid var(--divider-color);background:none;color:inherit;padding:6px 14px;min-height:38px;cursor:pointer}
    .seg button:first-child{border-left:0}
    .seg button[aria-pressed=true]{background:var(--primary-color);color:var(--text-primary-color)}
    .status{margin:0 0 16px;padding:12px 16px;border-radius:8px;font-size:14px;background:rgba(var(--rgb-success-color),.15)}
    .status.error{background:rgba(var(--rgb-error-color),.15);color:var(--error-color)}
    .notice{margin:0 0 16px;padding:12px 16px;border-radius:8px;font-size:14px;background:rgba(var(--rgb-warning-color),.15)}
    .notice.info{background:rgba(var(--rgb-primary-color),.12)}
    .notice ul{margin:6px 0 0;padding-left:18px}
    .notice .btn{margin-top:8px}
    .empty{padding:16px;color:var(--secondary-text-color)}
    .clickable{cursor:pointer}
    .clickable:hover{background:var(--secondary-background-color)}
    .chev{color:var(--secondary-text-color);flex:none}
    .switch{appearance:none;-webkit-appearance:none;width:44px;height:24px;border-radius:12px;background:var(--disabled-color);position:relative;cursor:pointer;margin:0;flex:none;transition:background .15s}
    .switch::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
    .switch:checked{background:var(--primary-color)}
    .switch:checked::after{left:23px}
    .switch:disabled{opacity:.4;cursor:default}
    .switch:focus-visible{outline:2px solid var(--primary-color);outline-offset:2px}
    label.grow{cursor:pointer}
    .pad{padding:0 16px 16px}
    .fields{display:flex;flex-wrap:wrap;gap:12px 16px;padding:0 16px 16px;align-items:flex-end}
    .fields>div{flex:1;min-width:220px}
    .danger-zone{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px}
    .code{display:block;margin:0;padding:12px;border-radius:8px;background:var(--secondary-background-color);font-family:var(--code-font-family);font-size:13px;overflow-wrap:anywhere;user-select:all}
    .tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--divider-color)}
    .tile{padding:14px 16px;border-left:1px solid var(--divider-color);min-width:0}
    .tile:first-child{border-left:0}
    .tile .sub{margin:0}
    .tile strong{display:block;font-size:22px;font-weight:400;margin-top:6px;overflow-wrap:anywhere}
    .tile strong small{font-size:13px;color:var(--secondary-text-color);margin-left:3px}
    .charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;border-top:1px solid var(--divider-color)}
    .chart{padding:12px 16px 14px;min-width:0}
    .chart+.chart{border-left:1px solid var(--divider-color)}
    .chart svg{display:block;width:100%;height:84px;margin-top:8px;overflow:visible}
    .chart .line{fill:none;stroke:var(--primary-color);stroke-width:2;vector-effect:non-scaling-stroke;stroke-linejoin:round}
    .chart .area{fill:rgba(var(--rgb-primary-color),.14);stroke:none}
    .chart .grid{stroke:var(--divider-color);stroke-width:1;vector-effect:non-scaling-stroke}
    .axis{display:flex;justify-content:space-between;font-size:12px;color:var(--secondary-text-color);margin-top:4px}
    .steps{counter-reset:step}
    .step{display:flex;gap:12px;padding:14px 16px;border-top:1px solid var(--divider-color)}
    .step .num{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:500;background:var(--secondary-background-color);color:var(--secondary-text-color)}
    .step.current .num{background:var(--primary-color);color:var(--text-primary-color)}
    .step.done .num{background:rgba(var(--rgb-success-color),.2);color:var(--success-color)}
    .step.later{opacity:.55}
    .step .body{flex:1;min-width:0}
    .step .body>*+*{margin-top:10px}
    .actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
    .toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:0 0 16px}
    .toolbar input{flex:1;min-width:200px;width:auto}
    .selected{background:rgba(var(--rgb-primary-color),.08)}
    .spinner{width:18px;height:18px;border-radius:50%;border:2px solid rgba(var(--rgb-primary-color),.25);border-top-color:var(--primary-color);animation:spin 1s linear infinite;flex:none}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){.spinner{animation:none}.switch,.switch::after{transition:none}}
    .hidden{display:none!important}
    @media (max-width:700px){
      .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
      .tile:nth-child(3){border-left:0}
      .tile:nth-child(n+3){border-top:1px solid var(--divider-color)}
      .charts{grid-template-columns:minmax(0,1fr)}
      .chart+.chart{border-left:0;border-top:1px solid var(--divider-color)}
    }
    @media (max-width:600px){
      main{padding:12px 12px 64px}
      .bar{padding:0 12px}
      .tabs button{flex:1;padding:12px 8px}
      .value{text-align:left}
    }
  </style>
</head>

    tab: TABS.some(([id]) => id === location.hash.slice(1)) ? location.hash.slice(1) : 'overview',
    status: null, statusError: null, telemetry: null, history: null, histWindow: 360,
    locations: {}, query: '', filter: 'all', callerShown: 25, busy: false, message: {text: ''},
    setupMessage: '', publicUrl: '', geoSaving: false,
    blocks: null, blockCidr: '', blockMinutes: '1440', myIp: null,
    targets: null, lockdownDraft: null, countries: {}, country: '', countryPick: '',

  // ---------- helpers ----------
  function el(tag, attrs = {}, ...children) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(attrs)) {
      if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
      else if (key === 'value') node.value = value;
      else if (value === true) node.setAttribute(key, '');
      else if (value !== false && value != null) node.setAttribute(key, value);

    node.append(...children.flat(Infinity).filter(child => child != null && child !== false));
    return node;
  }
  const NS = 'http://www.w3.org/2000/svg';
  function svgEl(tag, attrs = {}) {
    const node = document.createElementNS(NS, tag);
    for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
    return node;
  }
  function icon(path, cls) {
    const node = svgEl('svg', {viewBox: '0 0 24 24', 'aria-hidden': 'true'});
    if (cls) node.setAttribute('class', cls);

  const plural = (n, word, many = `${word}s`) => `${n} ${n === 1 ? word : many}`;
  const num = value => Number.isFinite(Number(value)) ? Number(value) : 0;
  function fmt(value, digits = 0) {
    return num(value).toLocaleString([], {maximumFractionDigits: digits, minimumFractionDigits: 0});
  }
  function ago(iso) {
    const date = new Date(iso);
    if (Number.isNaN(date.getTime())) return 'unknown time';
    const s = Math.round((Date.now() - date.getTime()) / 1000);
    if (s < 45) return 'just now';
    if (s < 3600) return `${Math.round(s / 60)} min ago`;
    if (s < 86400) return `${Math.round(s / 3600)} h ago`;
    if (s < 7 * 86400) return `${Math.round(s / 86400)} d ago`;
    return date.toLocaleDateString([], {dateStyle: 'medium'});
  }
  const exact = iso => { const d = new Date(iso); return Number.isNaN(d.getTime()) ? '' : d.toLocaleString([], {dateStyle: 'medium', timeStyle: 'medium'}); };
  function duration(seconds) {
    seconds = Math.max(0, Math.round(num(seconds)));
    const d = Math.floor(seconds / 86400), h = Math.floor(seconds % 86400 / 3600), m = Math.floor(seconds % 3600 / 60);
    if (d) return `${d} d ${h} h`;
    if (h) return `${h} h ${m} min`;
    if (m) return `${m} min`;
    return `${seconds} s`;
  }
  const isIp = value => typeof value === 'string' && value && value !== 'unknown';
  function bytes(value) {
    value = num(value);
    const units = ['B', 'KiB', 'MiB', 'GiB', 'TiB'];
    let i = 0;
    while (value >= 1024 && i < units.length - 1) { value /= 1024; i++; }
    return `${fmt(value, i ? 1 : 0)} ${units[i]}`;
  }
  function until(epoch) {
    if (!epoch) return 'until you unblock it';
    const left = epoch * 1000 - Date.now();
    if (left <= 0) return 'expiring';
    return `for ${duration(left / 1000)} more`;
  }

  // ---------- CSV export ----------
  function csvCell(value) {
    let text = value == null ? '' : String(value);
    if (/^[=+\-@\t\r]/.test(text)) text = `'${text}`;  // keep spreadsheets from running it as a formula
    return /[",\n\r]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
  }
  function downloadCsv(name, header, rows) {
    const text = [header, ...rows].map(row => row.map(csvCell).join(',')).join('\r\n') + '\r\n';
    const url = URL.createObjectURL(new Blob([text], {type: 'text/csv;charset=utf-8'}));
    const stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-');
    const link = el('a', {href: url, download: `home-tunnel-${name}-${stamp}.csv`});
    document.body.append(link); link.click(); link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  function exportCallers(m) {
    downloadCsv('callers', ['ip', 'status', 'requests', 'first_seen', 'last_seen', 'signed_in_at', 'location'],
      (m.caller_ips || []).map(r => [r.ip, r.status, r.requests, r.first_seen, r.last_seen, r.authenticated_at, state.locations[r.ip] || '']));
  }
  function exportRequests(m) {
    downloadCsv('requests', ['time', 'ip', 'method', 'path', 'status', 'duration_ms', 'request_bytes', 'response_bytes', 'location'],
      (m.recent_requests || []).slice().reverse().map(e => [e.observed_at, e.ip, e.method, e.route, e.status, e.duration_ms, e.request_bytes, e.response_bytes, state.locations[e.ip] || '']));
  }
  function exportHistory() {
    const h = state.history;
    if (!h?.available) return;
    const at = h.fields.indexOf('minute');
    downloadCsv('traffic', ['minute_utc', ...h.fields.filter(f => f !== 'minute')],
      h.minutes.map(row => [new Date(row[at] * 60000).toISOString(), ...row.filter((_, i) => i !== at)]));
  }

  async function api(path, body) {
    const response = await fetch(`${base}/api/${path}`, body
      ? {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)}
      : {cache: 'no-store'});
    const text = await response.text();
    if (!response.ok) throw new Error(text.replace(/^\d{3}:\s*/, '') || `Request failed (${response.status})`);
    return text ? JSON.parse(text) : {};
  }

  // ---------- Home Assistant theme ----------
  const THEME_VARS = ['primary-background-color', 'secondary-background-color', 'card-background-color',
    'primary-text-color', 'secondary-text-color', 'divider-color', 'primary-color', 'rgb-primary-color',
    'text-primary-color', 'app-header-background-color', 'app-header-text-color', 'success-color',
    'rgb-success-color', 'warning-color', 'rgb-warning-color', 'error-color', 'rgb-error-color',
    'disabled-color', 'ha-card-border-radius', 'code-font-family', 'ha-font-family-body'];
  let themeKey = '';
  function syncTheme() {
    let parentDoc;
    try { parentDoc = window.parent !== window && window.parent.document; } catch (error) { return; }
    if (!parentDoc) return;
    const computed = getComputedStyle(parentDoc.documentElement);
    const values = THEME_VARS.map(name => [name, computed.getPropertyValue(`--${name}`).trim()]).filter(([, v]) => v);
    const key = JSON.stringify(values);
    if (key === themeKey || !values.length) return;
    themeKey = key;
    const root = document.documentElement;
    for (const [name, value] of values) root.style.setProperty(`--${name}`, value);
    root.setAttribute('data-themed', '');
    // Pick the form-control colour scheme from the theme's background brightness.
    const bg = getComputedStyle(root).getPropertyValue('--primary-background-color').trim();
    const probe = document.createElement('span');
    probe.style.color = bg; document.body.append(probe);
    const rgb = (getComputedStyle(probe).color.match(/\d+(\.\d+)?/g) || [255, 255, 255]).map(Number);
    probe.remove();
    root.style.colorScheme = (0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2]) < 128 ? 'dark' : 'light';
  }
  // When HA's own narrow header is showing (phones), it already carries the panel title.
  function syncNarrow() {
    try {
      const narrow = window.parent !== window && window.parent.matchMedia('(max-width: 870px)').matches;
      document.documentElement.classList.toggle('ha-narrow', narrow);
    } catch (error) { /* not embedded */ }
  }

  // ---------- derived state ----------
  // Whether this browser reached Home Assistant through the tunnel itself.
  function viaTunnel() {
    const url = state.status?.relay_url;
    if (!url) return false;
    try { return window.top.location.origin === new URL(url).origin; } catch (error) { return false; }
  }

  function tunnelState() {
    const s = state.status;
    if (state.statusError && !s) return {tone: 'bad', title: 'Service unavailable', detail: state.statusError};
    if (!s) return {tone: '', title: 'Checking…', detail: ''};
    const m = state.telemetry?.available ? state.telemetry.metrics : null;
    if (!s.paired && s.pairing_pending) return {tone: 'warn', title: 'Pairing', detail: s.error || 'Authenticating the relay and exchanging the connector key.'};
    if (!s.paired) return {tone: '', title: 'Not set up', detail: 'Pair this app with your relay to reach Home Assistant from outside.'};
    if (!s.connected) return {tone: 'bad', title: 'Connector offline', detail: s.error || 'Trying to reach the relay.'};
    if (!s.forwarding_enabled) return {tone: 'warn', title: 'Forwarding off', detail: 'The connector is up, but the public URL does not reach Home Assistant until you turn forwarding on.'};
    if (m && m.public_reachable === false) return {tone: 'warn', title: 'Public check failing', detail: 'Forwarding is on, but the relay’s public URL did not answer the last health check.'};
    if (m && m.risk_status === 'attention') return {tone: 'warn', title: 'Online, needs attention', detail: 'Forwarding is on. See the notes below.'};
    return {tone: 'ok', title: 'Online', detail: 'The public URL forwards to Home Assistant.'};
  }

  function say(text, error = false) {
    state.message = {text, error};
    clearTimeout(say.timer);
    if (text && !error) say.timer = setTimeout(() => { state.message = {text: ''}; render(); }, 5000);
  }

  async function act(work, done) {
    // Leave any text field so the result can be shown (render waits while someone types).
    if (document.activeElement?.matches?.('input')) document.activeElement.blur();
    state.busy = true; render();
    try { await work(); if (done) say(done); await refreshStatus(); }
    catch (error) { say(error.message || 'Something went wrong.', true); }
    state.busy = false; render();
  }

  async function copy(text, what) {
    try { await navigator.clipboard.writeText(text); say(`${what} copied.`); }
    catch (error) { say(`Couldn’t copy. Select the ${what.toLowerCase()} and copy it by hand.`, true); }
    render();

  // ---------- building blocks ----------
  function section(iconPath, title, text, extra, ...body) {

        el('div', {class: 'grow'}, el('h2', {}, title), text ? el('p', {}, text) : null), extra),

    if (active && active.matches?.('input[type=text],input[type=url],input[type=number]') && document.getElementById('app').contains(active)) {
      pendingRender = true; return;
    }
    pendingRender = false;
    const focusId = active?.id;
    const tunnel = tunnelState();
    const top = el('div', {class: 'top'},
      el('div', {class: 'bar'},
        el('h1', {}, 'Home Tunnel'),

  // ----- Setup (not paired yet) -----
  function renderSetup() {
    const s = state.status;

    // Steps 2 and 3 are open together: add the hash, then pair.

      el('div', {class: 'body'}, el('div', {}, el('div', {class: 'title'}, title), sub ? el('div', {class: 'sub'}, sub) : null),

      el('p', {class: 'intro'}, 'Home Tunnel opens an outgoing connection from Home Assistant to a relay you host, so you can reach Home Assistant from outside without opening ports. Home Assistant still handles sign-in, MFA and permissions.'),

        step(2, 'Add its hash to the relay', 'In the relay’s web.config, replace the empty HaTunnelBootstrapCodeHash line with this one. Keep it private.',

              el('label', {class: 'field', for: 'public-url'}, 'Public URL'),

                  value: state.publicUrl, style: 'flex:1;min-width:220px;width:auto', oninput: e => { state.publicUrl = e.target.value; }}),
                el('button', {class: 'btn primary', type: 'submit', disabled: state.busy}, 'Pair'))))),

  }

  async function generateCode() {

  // ----- Overview -----
  function renderOverview() {
    const s = state.status;
    const t = state.telemetry;
    const m = t?.available ? t.metrics : null;
    const tunnel = tunnelState();
    const self = viaTunnel();
    const issues = Array.isArray(m?.risk_issues) ? m.risk_issues : [];
    const latestDev = /-dev(?:\.|$)/i.test(s.latest_relay_version || '');

    const forwardingSub = !s.connected && !s.forwarding_enabled ? 'Available once the connector is connected.'

      typeof relayHealth.certificate_days_left === 'number' && relayHealth.certificate_days_left < 14 ? el('div', {class: 'notice', role: 'alert'},
        el('div', {class: 'title'}, relayHealth.certificate_days_left < 0 ? 'The relay’s HTTPS certificate has expired' : `The relay’s HTTPS certificate expires in ${plural(relayHealth.certificate_days_left, 'day')}`),
        el('div', {class: 'sub'}, 'Renew it on the IIS host before it runs out.')) : null,
      sync && sync.ok === false && state.blocks.blocks.length ? el('div', {class: 'notice', role: 'alert'},
        el('div', {class: 'title'}, 'Blocked addresses aren’t enforced'),
        el('div', {class: 'sub'}, sync.error === 'relay_too_old' ? 'The relay is too old to enforce blocks. Update it to 0.5.0 or newer.' : 'The relay couldn’t be reached to update its block list. Retrying.')) : null,
      s.rotation_pending ? el('div', {class: 'notice'}, el('div', {class: 'title'}, 'Key rotation is finishing'),
        el('div', {class: 'sub'}, 'The relay hasn’t confirmed the new connector key yet. Both keys work until it does.')) : null,
      s.relay_update_available && !latestDev ? el('div', {class: 'notice info'},
        el('div', {class: 'title'}, `Relay ${s.latest_relay_version} is available`),
        el('div', {class: 'sub'}, `Your relay runs ${s.relay_version}. The relay is updated by hand on the IIS host.`),
        el('button', {class: 'btn', onclick: () => setTab('settings')}, 'Update details')) : null,

    const tile = (label, value, unit) => el('div', {class: 'tile'}, el('div', {class: 'sub'}, label),
      el('strong', {}, value, unit ? el('small', {}, unit) : null));
    const series = historySeries();
    const windowName = WINDOWS.find(([v]) => v === state.histWindow)[1];
    const traffic = section(ICONS.chart, 'Traffic',
      m ? `Live numbers from ${m.telemetry_age_seconds != null ? `${fmt(m.telemetry_age_seconds)} s` : 'moments'} ago. Charts keep 24 hours.` : telemetryReason(),
      segmented(WINDOWS, state.histWindow, value => { state.histWindow = value; render(); }, 'Chart window'),
      el('div', {class: 'tiles'},
        tile('Requests', m ? fmt(m.requests_per_minute, 1) : '—', '/min'),
        tile('Latency', m ? fmt(m.recent_latency_ms) : '—', 'ms'),
        tile('Data out', m ? fmt(m.http_kib_per_second, 1) : '—', 'KiB/s'),
        tile('Open WebSockets', m ? fmt(m.active_ws) : '—')),

        chart('Requests per minute', series.rate, 1, series),

        chart('Data sent per minute', series.bytes, 0, series, bytes)),

        ? `${fmt(series.total)} requests, ${bytes(series.totalBytes)} sent and ${plural(series.signins, 'sign-in')} in the last ${windowName}.`
        : `No traffic recorded in the last ${windowName}.`),
        state.history?.available ? el('button', {class: 'btn text', onclick: exportHistory}, icon(ICONS.download), 'Export CSV') : null));

    const health = m ? section(ICONS.heart, 'Health', 'Since the connector last started',
      null,
      factRow('Uptime', duration(m.uptime_seconds)),
      factRow('Automatic reconnects', fmt(m.automatic_reconnects)),
      factRow('Callers in the last 15 minutes', fmt(m.unique_ips_15m), 'Different addresses that reached the relay'),
      factRow('Signed-in sessions', fmt(m.authenticated_connections), 'Open Home Assistant connections that completed sign-in'),
      num(m.queued_http) ? factRow('Queued requests', fmt(m.queued_http), 'Waiting at the relay for a free slot', 'warn') : null,
      factRow('Denied requests', fmt(m.denied_5m), '401 and 403 answers in the last 5 minutes', num(m.denied_5m) >= 10 ? 'warn' : ''),
      factRow('Server errors', fmt(m.failures_5m), '5xx answers in the last 5 minutes', num(m.failures_5m) >= 5 ? 'warn' : ''),
      factRow('Audit log', m.audit_healthy === false ? 'Not writing' : 'OK', null),
      num(m.events_dropped) ? factRow('Dropped audit events', fmt(m.events_dropped), 'Events the relay couldn’t pass on', 'warn') : null) : null;

    return [tunnelCard, notices, traffic, health];
  }

  function telemetryReason() {
    const t = state.telemetry;
    if (!t) return 'Loading…';
    if (t.reason === 'invalid_configuration') return 'Check the metrics token in the app’s Configuration tab.';
    return 'Telemetry appears once the connector is connected.';
  }

  // Server-side traffic history, grouped so a chart has at most ~120 points.
  function historySeries() {
    const h = state.history;
    const span = state.histWindow, step = Math.max(1, Math.round(span / 120));
    const now = Math.floor(Date.now() / 60000), start = now - span + 1;
    const out = {rate: [], latency: [], bad: [], bytes: [], start, span, total: 0, totalBytes: 0, signins: 0};
    if (!h?.available) return out;
    const f = Object.fromEntries(h.fields.map((name, i) => [name, i]));
    const buckets = new Map();
    for (const row of h.minutes) {
      const minute = row[f.minute];
      if (minute < start) continue;
      const key = start + Math.floor((minute - start) / step) * step;
      const b = buckets.get(key) || {req: 0, bytes: 0, lat: 0, latN: 0, bad: 0};
      b.req += row[f.requests]; b.bytes += row[f.bytes]; b.lat += row[f.latency_sum]; b.latN += row[f.latency_count];
      b.bad += row[f.denied] + row[f.errors];
      buckets.set(key, b);
      out.total += row[f.requests]; out.totalBytes += row[f.bytes]; out.signins += row[f.signins];
    }
    for (let key = start; key <= now; key += step) {
      const b = buckets.get(key);
      const at = key + step / 2;
      out.rate.push([at, b ? b.req / step : 0]);
      out.bad.push([at, b ? b.bad / step : 0]);
      out.bytes.push([at, b ? b.bytes / step : 0]);
      if (b && b.latN) out.latency.push([at, b.lat / b.latN]);
    }
    return out;
  }

  function chart(label, points, digits, series, format = value => fmt(value, digits)) {
    const W = 300, H = 80;
    const {start, span} = series;
    const values = points.map(p => p[1]);
    const peak = values.length ? Math.max(...values) : null;
    const current = points.length ? points[points.length - 1][1] : null;
    const max = Math.max(1, peak || 0) * 1.1;
    const name = WINDOWS.find(([v]) => v === span)[1];
    const graph = svgEl('svg', {viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: 'none', role: 'img',
      'aria-label': `${label} over the last ${name}${peak != null ? `, peak ${format(peak)}` : ''}`});
    for (const y of [0, H / 2, H]) graph.append(svgEl('line', {x1: 0, x2: W, y1: y, y2: y, class: 'grid'}));
    if (points.length > 1) {
      const xy = points.map(([at, v]) => [W * (at - start) / span, H - H * v / max]);
      const line = xy.map(([x, y], i) => `${i ? 'L' : 'M'}${x.toFixed(1)},${y.toFixed(1)}`).join(' ');
      graph.append(svgEl('path', {d: `${line} L${xy[xy.length - 1][0].toFixed(1)},${H} L${xy[0][0].toFixed(1)},${H} Z`, class: 'area'}),
        svgEl('path', {d: line, class: 'line'}));
    }
    return el('div', {class: 'chart'},
      el('div', {class: 'actions', style: 'justify-content:space-between'},
        el('div', {class: 'sub', style: 'margin:0'}, label),
        el('div', {class: 'title'}, current == null ? '—' : format(current))),
      graph,
      el('div', {class: 'axis'}, el('span', {}, state.history?.available === false ? 'History appears once the connector runs' : `${name} ago`),
        el('span', {}, `peak ${peak != null ? format(peak) : '—'}`), el('span', {}, 'now')));
  }

  async function setForwarding(on, input) {
    if (!on) {
      const warning = viaTunnel()
        ? 'You are using Home Assistant through the tunnel right now. Turning forwarding off will disconnect this page, and you will need to turn it back on from your home network. Turn it off?'
        : 'Turn forwarding off? The public URL will stop reaching Home Assistant until you turn it back on.';
      if (!confirm(warning)) { input.checked = true; return; }
    }
    await act(() => api(on ? 'enable' : 'disable', {}), on ? 'Forwarding is on.' : 'Forwarding is off.');
  }

  // ----- Activity -----
  function blockedRow(ip) {
    const rows = state.blocks?.blocks || [];
    return rows.find(row => cidrContains(row.cidr, ip));
  }

  // Minimal CIDR test for display; the app and relay make the real decision.
  function cidrContains(cidr, ip) {
    if (!isIp(ip)) return false;
    const [net, bits] = cidr.split('/');
    const parse = value => {
      if (value.includes(':')) {
        let [head, tail] = value.split('::');
        const h = head ? head.split(':') : [], t = tail != null ? (tail ? tail.split(':') : []) : [];
        if (tail == null && h.length !== 8) return null;
        const groups = tail == null ? h : [...h, ...Array(8 - h.length - t.length).fill('0'), ...t];
        return groups.map(g => parseInt(g || '0', 16)).flatMap(g => [g >> 8, g & 255]);
      }
      const parts = value.split('.').map(Number);
      return parts.length === 4 ? parts : null;
    };
    const a = parse(net), b = parse(ip.replace(/^::ffff:(?=\d+\.)/i, ''));
    if (!a || !b || a.length !== b.length) return false;
    const prefix = bits == null ? a.length * 8 : Number(bits);
    for (let bit = 0; bit < prefix; bit++) {
      const mask = 0x80 >> (bit % 8);
      if ((a[bit >> 3] & mask) !== (b[bit >> 3] & mask)) return false;
    }
    return true;
  }

  function renderActivity() {
    const t = state.telemetry;
    const m = t?.available ? t.metrics : null;
    const blocksCard = renderBlocks();
    if (!m) return [section(ICONS.list, 'Activity', telemetryReason(), null), blocksCard];
    const callers = Array.isArray(m.caller_ips) ? m.caller_ips : [];
    const events = Array.isArray(m.recent_requests) ? m.recent_requests.slice().reverse() : [];
    const suspects = new Map((m.lockdown_candidates || []).map(row => [row.ip, row]));
    const query = state.query.trim().toLowerCase();
    const statusByIp = new Map(callers.map(row => [row.ip, row.status]));
    const inCountry = ip => !state.country || state.countries[ip] === state.country;
    const matchCaller = row => (state.filter === 'all' || row.status === state.filter) && inCountry(row.ip) && (!query || row.ip.toLowerCase().includes(query)
      || (state.locations[row.ip] || '').toLowerCase().includes(query));
    const rows = callers.filter(matchCaller);
    const shown = rows.slice(0, state.callerShown);
    const filteredEvents = events.filter(event => {
      const ip = typeof event.ip === 'string' ? event.ip : '';
      return (!query || ip.toLowerCase().includes(query) || String(event.route || '').toLowerCase().includes(query))
        && inCountry(ip) && (state.filter === 'all' || (statusByIp.get(ip) || 'unknown') === state.filter);
    });
    const loc = ip => state.locations[ip] || null;

    const search = el('input', {type: 'search', id: 'activity-search', placeholder: 'Filter by IP address, place or path', value: state.query,
      'aria-label': 'Filter activity', oninput: e => {
        state.query = e.target.value; state.callerShown = 25; render();
        const input = document.getElementById('activity-search');
        if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
      }});

    const callerRow = row => {
      const selected = query && row.ip.toLowerCase() === query;
      const pick = () => { state.query = selected ? '' : row.ip; render(); };
      const block = blockedRow(row.ip);
      const suspect = suspects.get(row.ip);
      const stop = e => e.stopPropagation();
      return el('div', {class: `row clickable${selected ? ' selected' : ''}`, tabindex: '0', role: 'button',
        'aria-pressed': String(!!selected), 'aria-label': selected ? 'Show all callers' : `Show requests from ${row.ip}`,
        onclick: pick, onkeydown: e => e.target === e.currentTarget && (e.key === 'Enter' || e.key === ' ') && (e.preventDefault(), pick())},
        el('div', {class: 'grow'},
          el('div', {class: 'title mono'}, state.countries[row.ip] ? `${flag(state.countries[row.ip])} ` : '', row.ip),
          el('div', {class: 'sub'}, [loc(row.ip), plural(num(row.requests), 'request'), `last seen ${ago(row.last_seen)}`].filter(Boolean).join(' · ')),
          el('div', {class: 'chips'},
            row.status === 'authenticated'
              ? chip(`Signed in to HA ${ago(row.authenticated_at)}`, 'ok', `A Home Assistant sign-in was seen from this address on ${exact(row.authenticated_at)}`)
              : chip('No sign-in seen', 'warn', 'This address made requests but never completed a Home Assistant sign-in'),
            block ? chip(block.cidr === row.ip ? 'Blocked' : `Blocked by ${block.cidr}`, 'bad') : null,
            suspect ? chip([suspect.denied_10m ? plural(suspect.denied_10m, 'denied answer') : null,
              suspect.logins_10m ? plural(suspect.logins_10m, 'login attempt') : null].filter(Boolean).join(', ') + ' in 10 min', 'warn') : null,
            row.ip === state.myIp ? chip('You', 'info', 'The address this browser is using') : null,
            row.first_seen ? chip(`First seen ${ago(row.first_seen)}`) : null)),
        block
          ? el('button', {class: 'btn text', disabled: state.busy, onclick: e => { stop(e); unblock(block.cidr); }, onkeydown: stop}, 'Unblock')
          : el('button', {class: 'btn text danger', disabled: state.busy, onclick: e => { stop(e); blockAddress(row.ip, row.status === 'authenticated'); },
            onkeydown: stop, 'aria-label': `Block ${row.ip}`}, icon(ICONS.block), 'Block'));
    };

    const statusTone = code => code >= 500 ? 'bad' : code >= 400 ? 'warn' : code >= 300 ? 'info' : 'ok';
    const eventRow = event => el('div', {class: 'row'},
      chip(event.method || '—', 'method'),
      el('div', {class: 'grow'},
        el('div', {class: 'title mono', style: 'font-weight:400;font-size:13px'}, event.route || '/'),
        el('div', {class: 'sub'}, [isIp(event.ip) ? event.ip : 'IP unavailable', loc(event.ip),
          event.duration_ms != null ? `${fmt(event.duration_ms)} ms` : null,
          event.observed_at ? ago(event.observed_at) : null].filter(Boolean).join(' · '))),
      chip(String(event.status ?? '—'), statusTone(num(event.status))));

    const historyNote = m.caller_ip_history_ok === false ? 'History storage is unavailable; addresses are kept in memory only.'
      : `Kept privately in Home Assistant for ${m.caller_ip_retention_days || 30} days · ${plural(callers.length, 'address', 'addresses')}`;
    const csv = (what, run) => el('button', {class: 'btn text', onclick: run, 'aria-label': `Export ${what} as CSV`, title: `Export ${what} as CSV`},
      icon(ICONS.download), 'CSV');

    return [
      el('div', {class: 'toolbar'}, search,
        segmented(CALLER_FILTERS, state.filter, value => { state.filter = value; state.callerShown = 25; render(); }, 'Caller filter'),
        state.country ? el('button', {class: 'btn', onclick: () => { state.country = ''; render(); }, 'aria-label': `Stop showing only ${countryName(state.country)}`},
          `${flag(state.country)} ${countryName(state.country)} ×`) : null,
        el('button', {class: 'btn', id: 'refresh-activity', onclick: () => { refreshTelemetry(); refreshBlocks(); }, 'aria-label': 'Refresh', title: 'Refresh'}, icon(ICONS.refresh))),
      renderCountries(callers),
      section(ICONS.people, 'Callers', historyNote, callers.length ? csv('callers', () => exportCallers(m)) : null,
        shown.length ? shown.map(callerRow) : el('div', {class: 'empty'}, callers.length ? 'No callers match this filter.' : 'No one has called the public URL yet.'),
        rows.length > shown.length ? el('div', {class: 'row'}, el('div', {class: 'grow sub'}, `Showing ${shown.length} of ${rows.length}`),
          el('button', {class: 'btn text', onclick: () => { state.callerShown += 25; render(); }}, 'Show more')) : null),
      section(ICONS.list, 'Recent requests', query || state.filter !== 'all'
        ? `${plural(filteredEvents.length, 'request')} match the filter` : `The last ${plural(events.length, 'request')}, newest first`,
        events.length ? csv('requests', () => exportRequests(m)) : null,
        filteredEvents.length ? filteredEvents.map(eventRow) : el('div', {class: 'empty'}, events.length ? 'No requests match this filter.' : 'No requests yet.')),
      blocksCard,
      el('section', {class: 'card'}, el('div', {class: 'danger-zone'},
        el('div', {class: 'grow'}, el('div', {class: 'title'}, 'Clear caller history'),
          el('div', {class: 'sub'}, 'Forgets every stored caller address and sign-in marker. Blocked addresses stay blocked. This can’t be undone.')),
        el('button', {class: 'btn danger', disabled: state.busy || !callers.length, onclick: clearHistory}, icon(ICONS.delete), 'Clear'))),
    ];
  }

  function renderCountries(callers) {
    const s = state.status;
    if (!s.geolocation_enabled) {
      return section(ICONS.shield, 'Countries', null, null, el('div', {class: 'row'},
        el('div', {class: 'grow sub'}, 'Turn on caller locations to see where callers come from and to block countries.'),
        el('button', {class: 'btn', onclick: () => setTab('settings')}, 'Settings')));
    }
    const c = s.countries || {mode: 'off', codes: []};
    const groups = new Map();
    for (const row of callers) {
      const code = state.countries[row.ip];
      if (!code) continue;
      const g = groups.get(code) || {code, callers: 0, requests: 0, signedIn: 0};
      g.callers++; g.requests += num(row.requests); g.signedIn += row.status === 'authenticated' ? 1 : 0;
      groups.set(code, g);
    }
    const located = [...groups.values()].reduce((sum, g) => sum + g.callers, 0);
    const sorted = [...groups.values()].sort((a, b) => b.requests - a.requests);
    const ruleFor = code => c.mode === 'block' ? c.codes.includes(code) : c.mode === 'allow' ? !c.codes.includes(code) : false;
    const toggle = code => {
      if (c.mode === 'allow') {
        const codes = c.codes.includes(code) ? c.codes.filter(x => x !== code) : [...c.codes, code];
        if (!codes.length) { say('Keep at least one allowed country, or turn the country rule off in Settings.', true); render(); return; }
        return saveCountries({...c, codes});
      }
      const codes = c.codes.includes(code) ? c.codes.filter(x => x !== code) : [...c.codes, code];
      if (c.mode === 'off' && !confirm(`Block callers from ${countryName(code)}? New addresses from there are blocked the first time they’re seen. Addresses that have signed in are never blocked.`)) return;
      return saveCountries({...c, codes, mode: c.mode === 'off' ? 'block' : c.mode});
    };
    return section(ICONS.shield, 'Countries', located
      ? `${plural(located, 'caller')} located in ${plural(groups.size, 'country', 'countries')}${callers.length > located ? `; ${callers.length - located} still to look up` : ''}`
      : 'Locations appear as callers are looked up.', null,
      sorted.slice(0, 12).map(g => {
        const pick = () => { state.country = state.country === g.code ? '' : g.code; state.callerShown = 25; render(); };
        const blockedHere = ruleFor(g.code);
        return el('div', {class: `row clickable${state.country === g.code ? ' selected' : ''}`, tabindex: '0', role: 'button',
          'aria-label': `Show callers from ${countryName(g.code)}`, onclick: pick,
          onkeydown: e => e.target === e.currentTarget && (e.key === 'Enter' || e.key === ' ') && (e.preventDefault(), pick())},
          el('div', {class: 'grow'}, el('div', {class: 'title'}, `${flag(g.code)} ${countryName(g.code)}`),
            el('div', {class: 'sub'}, [plural(g.callers, 'caller'), plural(g.requests, 'request'), g.signedIn ? `${g.signedIn} signed in` : null].filter(Boolean).join(' · ')),
            blockedHere ? el('div', {class: 'chips'}, chip(c.mode === 'allow' ? 'Not allowed' : 'Blocked country', 'bad')) : null),
          el('button', {class: `btn text${blockedHere ? '' : ' danger'}`, disabled: state.busy, onclick: e => { e.stopPropagation(); toggle(g.code); }, onkeydown: e => e.stopPropagation()},
            c.mode === 'allow' ? (c.codes.includes(g.code) ? 'Stop allowing' : 'Allow') : (blockedHere ? 'Unblock country' : 'Block country')));
      }),
      sorted.length > 12 ? el('div', {class: 'row'}, el('div', {class: 'grow sub'}, `And ${plural(sorted.length - 12, 'more country', 'more countries')}`)) : null);
  }

  function renderBlocks() {
    const b = state.blocks;
    const rows = b?.blocks || [];
    const sync = b?.sync || {};
    const syncText = !state.status?.paired ? 'Blocks are enforced by the relay once Home Tunnel is paired.'
      : sync.ok === true ? `The relay enforces ${plural(rows.length, 'block')}; checked ${sync.at ? ago(new Date(sync.at * 1000).toISOString()) : 'recently'}.`
      : sync.error === 'relay_too_old' ? 'The relay is too old to enforce blocks. Update it to 0.5.0 or newer.'
      : sync.ok === false ? 'Couldn’t update the relay’s block list. Retrying.'
      : 'Sending the list to the relay…';
    const form = el('form', {onsubmit: e => { e.preventDefault(); blockAddress(state.blockCidr.trim(), false, Number(state.blockMinutes) || null); }},
      el('div', {class: 'fields', style: 'padding-top:4px'},
        el('div', {}, el('label', {class: 'field', for: 'block-cidr'}, 'Address or range'),
          el('input', {type: 'text', id: 'block-cidr', placeholder: '203.0.113.7 or 203.0.113.0/24', value: state.blockCidr, autocomplete: 'off',
            spellcheck: 'false', oninput: e => { state.blockCidr = e.target.value; }})),
        el('div', {style: 'flex:0 1 auto;min-width:160px'}, el('label', {class: 'field', for: 'block-minutes'}, 'For'),
          el('select', {id: 'block-minutes', style: 'width:100%', onchange: e => { state.blockMinutes = e.target.value; }},
            BLOCK_DURATIONS.map(([value, text]) => el('option', {value, selected: value === state.blockMinutes}, text)))),
        el('div', {style: 'flex:0 0 auto;min-width:0'}, el('button', {class: 'btn primary', type: 'submit', disabled: state.busy}, icon(ICONS.block), 'Block'))));
    return section(ICONS.block, 'Blocked addresses', 'The relay turns these away before they reach Home Assistant.', null,
      el('div', {class: 'row'}, el('div', {class: `grow sub${sync.ok === false && rows.length ? ' warn' : ''}`}, syncText)),
      rows.map(row => el('div', {class: 'row'},
        el('div', {class: 'grow'}, el('div', {class: 'title mono'}, row.cidr),
          el('div', {class: 'sub'}, [row.reason, until(row.until)].filter(Boolean).join(' · ')),
          el('div', {class: 'chips'}, chip(row.source === 'auto' ? 'Automatic' : row.source === 'country' ? 'Country' : 'Manual', row.source === 'manual' ? '' : 'warn'),
            chip(`Added ${ago(new Date(row.created * 1000).toISOString())}`))),
        el('button', {class: 'btn text', disabled: state.busy, onclick: () => unblock(row.cidr)}, 'Unblock'))),
      form);
  }

  async function blockAddress(cidr, signedIn = false, minutes = 1440) {
    if (!cidr) { say('Enter an address or range to block.', true); render(); return; }
    const mine = state.myIp && cidrContains(cidr.includes('/') ? cidr : cidr, state.myIp);
    const warning = mine ? `You are using ${state.myIp} right now. Blocking ${cidr} cuts this browser off from Home Assistant until you unblock it from your home network. Block it anyway?`
      : signedIn ? `${cidr} has signed in to Home Assistant before. Block it anyway?`
      : null;
    if (warning && !confirm(warning)) return;
    await act(async () => {
      state.blocks = await api('blocks', {cidr, minutes});
      state.blockCidr = '';
    }, `Blocked ${cidr}.`);
  }

  async function unblock(cidr) {
    await act(async () => { state.blocks = await api('blocks/remove', {cidr}); }, `Unblocked ${cidr}.`);
  }

  async function clearHistory() {
    if (!confirm('Clear all stored caller addresses? This can’t be undone.')) return;
    await act(async () => { await api('caller-ips/clear', {}); await refreshTelemetry(); }, 'Caller history cleared.');
  }


  // ----- Settings -----
  function renderSettings() {
    const s = state.status;
    const latestDev = /-dev(?:\.|$)/i.test(s.latest_relay_version || '');
    const features = s.relay_features || [];
    let relayStatus, relayTone;
    if (!s.relay_version) { relayStatus = s.paired ? 'Waiting for the relay to report its version' : 'Not paired'; relayTone = ''; }
    else if (!s.latest_relay_version) { relayStatus = 'Release information isn’t available yet'; relayTone = ''; }
    else if (latestDev) { relayStatus = `Development build ${s.latest_relay_version} is the latest; no stable release is published`; relayTone = 'info'; }
    else if (s.relay_update_available) { relayStatus = `Update available: ${s.latest_relay_version}`; relayTone = 'warn'; }
    else { relayStatus = 'Up to date'; relayTone = 'ok'; }
    const link = (href, text) => href ? el('a', {class: 'btn text', href, target: '_blank', rel: 'noopener noreferrer'}, text, icon(ICONS.open)) : null;
    const health = s.relay_health || {};
    const certificate = health.certificate_error === 'not_trusted' ? ['Not trusted by this system', 'bad']
      : health.certificate_error ? ['Couldn’t be checked', 'warn']
      : typeof health.certificate_days_left === 'number'
        ? [`Expires in ${plural(health.certificate_days_left, 'day')} (${new Date(health.certificate_expires_at * 1000).toLocaleDateString([], {dateStyle: 'medium'})})${health.certificate_issuer ? ` · ${health.certificate_issuer}` : ''}`,
          health.certificate_days_left < 14 ? 'warn' : '']
        : ['Checked after pairing', ''];
    const needsRelay = feature => features.includes(feature) ? null : 'Needs relay 0.5.0 or newer.';

    return [
      s.paired ? section(ICONS.link, 'Relay', 'The relay this app is paired with', null,
        factRow('Public URL', null, s.relay_url || '—'),
        factRow('Connector', null, s.connected ? 'Connected' : (s.error || 'Not connected'), s.connected ? '' : 'bad'),
        factRow('Response time', s.relay_latency_ms != null ? `${fmt(s.relay_latency_ms)} ms` : '—', 'From Home Assistant to the relay, checked every 5 minutes'),
        factRow('HTTPS certificate', null, certificate[0], certificate[1]),
        el('div', {class: 'row'},
          el('div', {class: 'grow'}, el('div', {class: 'title'}, 'Connector key'),
            el('div', {class: `sub${needsRelay('rotate') ? ' warn' : ''}`}, needsRelay('rotate') ||
              (s.rotation_pending ? 'A new key is waiting for the relay to confirm it.' : 'Replace the key the connector uses to reach the relay. The tunnel reconnects in a few seconds.'))),
          el('button', {class: 'btn', disabled: state.busy || !!needsRelay('rotate'), onclick: rotateKey}, icon(ICONS.key), 'Rotate key'))) : null,

      s.paired ? el('section', {class: 'card'}, el('div', {class: 'danger-zone'},
        el('div', {class: 'grow'}, el('div', {class: 'title'}, 'Unpair'),
          el('div', {class: 'sub'}, 'Stops the tunnel and makes this app and the relay forget each other, so you can pair again with a new setup code.')),
        el('button', {class: 'btn danger', disabled: state.busy, onclick: unpairRelay}, icon(ICONS.delete), 'Unpair'))) : null,

      renderLockdown(),
      renderLocations(),
      renderNotifications(),

      section(ICONS.update, 'Versions', 'The app updates through Home Assistant; the relay is updated by hand on the IIS host.', null,
        factRow('Home Tunnel app', s.home_tunnel_version || 'unknown'),
        el('div', {class: 'row'},
          el('div', {class: 'grow'}, el('div', {class: 'title'}, 'Relay'),
            el('div', {class: 'chips'}, chip(relayStatus, relayTone),
              s.relay_compatible === false ? chip('Compatibility with this app version isn’t confirmed', 'warn') : null)),
          el('div', {class: 'value'}, s.relay_version || '—')),
        s.release_checked_at ? factRow('Last release check', null, ago(new Date(s.release_checked_at * 1000).toISOString())) : null,
        el('div', {class: 'row'}, el('div', {class: 'actions'},
          link(s.release_url, 'Releases'), link(s.changelog_url, 'Changelog'), link(s.manual_update_url, 'Relay update guide')))),

      section(ICONS.info, 'About', null, null,
        el('div', {class: 'pad'}, el('p', {class: 'sub', style: 'margin:0'},
          'Home Tunnel forwards requests from your own relay to this Home Assistant over an outgoing WebSocket. The relay is not an identity provider: Home Assistant still handles sign-in, MFA and permissions, so keep strong passwords and MFA on every account that can sign in from outside.'))),
    ];
  }

  function renderLockdown() {
    const saved = state.status.lockdown;
    const draft = state.lockdownDraft || (state.lockdownDraft = {...saved});
    const numberField = (key, label, min, max) => el('div', {style: 'min-width:150px'},
      el('label', {class: 'field', for: `lock-${key}`}, label),
      el('input', {type: 'number', id: `lock-${key}`, min: String(min), max: String(max), step: '1', value: String(draft[key]),
        style: 'width:100%', disabled: !saved.enabled, oninput: e => { draft[key] = e.target.value; }}));
    return section(ICONS.lock, 'Automatic lockdown',
      'Blocks an address at the relay when it keeps failing. Home Assistant’s own IP ban can’t do this behind the tunnel: every request reaches it from this app.', null,
      toggleRow('Block repeat offenders', saved.enabled
        ? 'Addresses that have signed in to Home Assistant are never blocked automatically.'
        : 'Off: noisy addresses are only reported.', saved.enabled, on => saveLockdown({...saved, enabled: on}), state.busy),
      saved.enabled ? el('form', {onsubmit: e => { e.preventDefault(); saveLockdown({...saved, denied: Number(draft.denied), logins: Number(draft.logins), minutes: Number(draft.minutes)}); }},
        el('div', {class: 'fields', style: 'padding-top:12px'},
          numberField('denied', 'Denied answers in 10 min', 5, 1000),
          numberField('logins', 'Login attempts in 10 min', 5, 1000),
          numberField('minutes', 'Block for (minutes)', 5, 10080),
          el('div', {style: 'flex:0 0 auto;min-width:0'}, el('button', {class: 'btn primary', type: 'submit', disabled: state.busy}, 'Save'))),
        el('div', {class: 'pad sub', style: 'margin-top:-6px'}, 'A login takes 2 to 3 attempts, so 15 attempts is about 5 failed logins.')) : null);
  }

  function renderNotifications() {
    const s = state.status;
    const n = s.notifications;
    if (!s.notifications_available) {
      return section(ICONS.bell, 'Notifications', null, null, el('div', {class: 'row'}, el('div', {class: 'grow sub warn'},
        'Home Assistant didn’t give this app API access, so it can’t send notifications. Restart the app after updating it; if this stays, reinstall it.')));
    }
    if (state.targets == null) loadTargets();
    const targets = state.targets?.targets || ['persistent_notification'];
    const label = target => target === 'persistent_notification' ? 'Home Assistant notifications (bell)' : target.replace(/^notify\./, 'Notify: ');
    const save = changes => saveNotifications({...n, ...changes});
    return section(ICONS.bell, 'Notifications', 'Alerts sent through Home Assistant', null,
      el('div', {class: 'fields', style: 'padding-top:4px'},
        el('div', {}, el('label', {class: 'field', for: 'notify-target'}, 'Send to'),
          el('select', {id: 'notify-target', style: 'width:100%', disabled: state.busy, onchange: e => save({target: e.target.value})},
            el('option', {value: '', selected: !n.target}, 'Don’t send notifications'),
            [...new Set([...targets, ...(n.target ? [n.target] : [])])].map(target => el('option', {value: target, selected: target === n.target}, label(target))))),
        el('div', {style: 'flex:0 0 auto;min-width:0'}, el('button', {class: 'btn', disabled: state.busy || !n.target, onclick: testNotification}, 'Send test'))),
      state.targets?.error ? el('div', {class: 'pad sub warn'}, 'Couldn’t list notify services from Home Assistant; only the built-in option is shown.') : null,
      n.target ? NOTIFY_EVENTS.map(([key, title, sub]) => toggleRow(title, sub, !!n.events[key],
        on => save({events: {...n.events, [key]: on}}), state.busy)) : null);
  }

  async function loadTargets() {
    state.targets = {targets: ['persistent_notification'], error: null, loading: true};
    try { state.targets = await api('notify/targets'); } catch (error) { state.targets = {targets: ['persistent_notification'], error: 'unreachable'}; }
    render();
  }

  async function saveLockdown(value) {
    await act(async () => { await api('settings', {lockdown: value}); state.lockdownDraft = null; },
      value.enabled ? 'Automatic lockdown saved.' : 'Automatic lockdown is off.');
  }

  async function saveNotifications(value) {
    await act(() => api('settings', {notifications: value}), value.target ? 'Notification settings saved.' : 'Notifications are off.');
  }

  async function testNotification() {
    await act(() => api('notify/test', {target: state.status.notifications.target}), 'Test notification sent.');
  }

  async function rotateKey() {
    if (!confirm('Rotate the connector key? The tunnel drops for a few seconds while the connector reconnects with the new key.')) return;
    await act(async () => {
      const result = await api('rotate-key', {});
      if (!result.rotated) throw new Error('The relay hasn’t confirmed the new key yet. Home Tunnel keeps trying; both keys work meanwhile.');
    }, 'Connector key rotated.');
  }

  async function unpairRelay() {
    const self = viaTunnel();
    if (!confirm(`${self ? 'You are using Home Assistant through the tunnel right now; this page will disconnect. ' : ''}Unpair from ${state.status.relay_url}? The tunnel stops, and pairing again needs a new setup code and web.config hash.`)) return;
    await act(async () => {
      try {
        await api('unpair', {});
      } catch (error) {
        if (!confirm(`${error.message}\n\nUnpair only here? The relay keeps its old pairing until you delete App_Data\\home-tunnel-state.json on the IIS host.`)) throw error;
        await api('unpair', {force: true});
      }
      state.tab = 'overview';
      history.replaceState(null, '', '#overview');
    }, 'Unpaired. Create a new setup code to pair again.');
  }

  function renderLocations() {
    const s = state.status;
    const c = s.countries || {mode: 'off', codes: [], minutes: 43200};
    const on = !!s.geolocation_enabled;
    const save = changes => saveCountries({...c, ...changes});
    const available = COUNTRY_CODES.filter(code => !c.codes.includes(code))
      .map(code => [code, countryName(code)]).sort((a, b) => a[1].localeCompare(b[1]));
    const add = () => {
      const code = state.countryPick;
      if (!code) return;
      state.countryPick = '';
      save({codes: [...c.codes, code]});
    };
    const myCountry = state.myIp ? state.countries[state.myIp] : null;
    const selfRisk = myCountry && c.mode !== 'off' && (c.mode === 'block' ? c.codes.includes(myCountry) : !c.codes.includes(myCountry));
    const rules = !on ? [
      el('div', {class: 'row'}, el('div', {class: 'grow sub warn'},
        'Country data and country blocking need caller locations. Turn it on above to use them.')),
    ] : [
      el('div', {class: 'group'}, el('span', {class: 'grow'}, 'Block by country')),
      el('div', {class: 'row'},
        el('div', {class: 'grow'}, el('div', {class: 'title'}, 'Rule'),
          el('div', {class: 'sub'}, c.mode === 'off' ? 'Countries are shown, but nothing is blocked by country.'
            : c.mode === 'block' ? 'Callers from the listed countries are blocked the first time they’re seen.'
            : 'Callers from any country not listed are blocked the first time they’re seen.')),
        segmented(COUNTRY_MODES, c.mode, mode => {
          if (mode === 'allow' && !c.codes.length) { say('Add at least one country first, then pick Allow only listed.', true); render(); return; }
          save({mode});
        }, 'Country rule')),
      el('div', {class: 'row'},
        el('div', {class: 'grow'}, el('div', {class: 'title'}, c.mode === 'allow' ? 'Allowed countries' : 'Countries'),
          c.codes.length ? el('div', {class: 'chips'}, c.codes.map(code => el('span', {class: 'chip info'}, `${flag(code)} ${countryName(code)}`,
            el('button', {class: 'chip-x', type: 'button', 'aria-label': `Remove ${countryName(code)}`, title: 'Remove', disabled: state.busy,
              onclick: () => save({codes: c.codes.filter(x => x !== code), mode: c.mode === 'allow' && c.codes.length === 1 ? 'off' : c.mode})}, '×'))))
            : el('div', {class: 'sub'}, 'None yet.'))),
      el('div', {class: 'fields', style: 'padding-top:12px'},
        el('div', {}, el('label', {class: 'field', for: 'country-pick'}, 'Add a country'),
          el('select', {id: 'country-pick', style: 'width:100%', onchange: e => { state.countryPick = e.target.value; }},
            el('option', {value: '', selected: !state.countryPick}, 'Pick a country…'),
            available.map(([code, name]) => el('option', {value: code, selected: code === state.countryPick}, `${flag(code)} ${name}`)))),
        el('div', {style: 'flex:0 0 auto;min-width:0'}, el('button', {class: 'btn', type: 'button', disabled: state.busy, onclick: add}, 'Add')),
        el('div', {style: 'min-width:160px'}, el('label', {class: 'field', for: 'country-minutes'}, 'Block for'),
          el('select', {id: 'country-minutes', style: 'width:100%', disabled: state.busy, onchange: e => save({minutes: Number(e.target.value) || null})},
            BLOCK_DURATIONS.filter(([value]) => value !== '60').map(([value, text]) =>
              el('option', {value, selected: String(c.minutes ?? '') === value}, text))))),
      selfRisk ? el('div', {class: 'pad sub warn'}, `You are connecting from ${countryName(myCountry)}. This rule would block you if you weren’t already signed in.`) : null,
      el('div', {class: 'pad sub'}, 'Each address is checked the first time it’s seen, so its first requests get through. Addresses that have signed in to Home Assistant are never blocked by country. Lookups count toward the 200-a-day limit; once it’s reached, new addresses aren’t checked until the next day.'),
    ];
    return section(ICONS.shield, 'Caller locations and countries', 'What Home Tunnel looks up about callers', null,
      toggleRow('Look up caller locations',
        state.geoSaving ? 'Saving…' : 'Sends public caller addresses to ipapi.co for an approximate city, region and country. Results are cached for a day, at most 200 new addresses a day, and can be wrong. Turning this off also turns off country data and country blocking.',
        on, setGeolocation, state.geoSaving),
      rules);
  }

  async function saveCountries(value) {
    await act(() => api('settings', {countries: value}),
      value.mode === 'off' ? 'Country blocking is off.' : 'Country rule saved.');
  }

  async function setGeolocation(on, input) {
    const c = state.status.countries;
    if (!on && !confirm(c && c.mode !== 'off'
      ? 'Turn off caller locations? This also turns off country data and country blocking: new callers won’t be checked by country. Addresses already blocked stay blocked until their block ends.'
      : 'Turn off caller locations? Country data disappears from Activity, and country blocking can’t be used until you turn it back on.')) {
      input.checked = true; return;
    }
    state.geoSaving = true; render();
    try {
      await api('settings', {geolocation_enabled: on});
      state.status.geolocation_enabled = on;
      if (!on) { state.locations = {}; state.countries = {}; state.country = ''; }
      say(on ? 'Caller locations turned on.' : 'Caller locations turned off.');
      if (on) lookupLocations();
    } catch (error) {
      input.checked = !on;
      say(`Couldn’t save: ${error.message}`, true);
    }
    state.geoSaving = false; render();
  }


  // ---------- data ----------
  let lastStatusKey = '';
  async function refreshStatus() {
    try {
      state.status = await api('status');
      state.statusError = null;
    } catch (error) {
      state.statusError = error.message;
    }
    const key = JSON.stringify([state.status, state.statusError]);
    if (key !== lastStatusKey) { lastStatusKey = key; render(); }
  }

  async function refreshTelemetry() {
    try {
      state.telemetry = await api('telemetry');
    } catch (error) {
      state.telemetry = {available: false, reason: 'endpoint_unavailable'};
    }
    render();
    lookupLocations();
  }

  async function refreshHistory() {
    try { state.history = await api('history?minutes=1440'); } catch (error) { state.history = {available: false, fields: [], minutes: []}; }
    render();
  }

  async function refreshBlocks() {
    try { state.blocks = await api('blocks'); } catch (error) { /* keep the last list */ }
    render();
  }

  // When this page is reached through the tunnel, ask the relay which address it sees,
  // so blocking yourself needs a second look.
  async function findMyIp() {
    if (!viaTunnel()) return;
    try {
      const response = await fetch('/_whoami.ashx', {cache: 'no-store', credentials: 'omit'});
      const data = await response.json();
      if (typeof data.ip === 'string') { state.myIp = data.ip; render(); }
    } catch (error) { /* only a convenience */ }
  }

  // Ask for locations of addresses we don't know yet, newest first, 10 at a time.
  async function lookupLocations() {
    const m = state.telemetry?.available ? state.telemetry.metrics : null;
    if (!m || !state.status?.geolocation_enabled) return;
    const recent = (Array.isArray(m.recent_requests) ? m.recent_requests.slice().reverse() : []).map(e => e.ip);
    const callers = (Array.isArray(m.caller_ips) ? m.caller_ips : []).map(r => r.ip);
    const ips = [...new Set([...recent, ...callers])].filter(ip => isIp(ip) && !(ip in state.locations)).slice(0, 10);
    if (!ips.length) return;
    try {
      const result = await api(`geolocation?ips=${encodeURIComponent(ips.join(','))}`);
      if (!result.enabled) return;
      for (const ip of ips) {
        state.locations[ip] = (result.locations || {})[ip] || '';
        if ((result.countries || {})[ip]) state.countries[ip] = result.countries[ip];
      }
      render();
    } catch (error) { /* locations are optional */ }
  }

  // ---------- start ----------
  syncTheme(); syncNarrow();
  render();
  refreshStatus().then(findMyIp); refreshTelemetry(); refreshHistory(); refreshBlocks();
  setInterval(() => { if (!document.hidden) refreshStatus(); }, 3000);
  setInterval(() => { if (!document.hidden) refreshTelemetry(); }, 10000);
  setInterval(() => { if (!document.hidden) { refreshHistory(); refreshBlocks(); } }, 60000);
  setInterval(() => { syncTheme(); syncNarrow(); }, 2000);
  window.addEventListener('resize', syncNarrow);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { refreshStatus(); refreshTelemetry(); refreshHistory(); } });
})();

</script>
</body>
</html>
